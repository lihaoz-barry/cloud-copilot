<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>cloud-copilot · issues console</title>
  <style>
    :root { color-scheme: light dark; --gap: 12px; }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 860px; margin: 0 auto; padding: 16px 14px 60px; line-height: 1.45;
    }
    h1 { font-size: 1.3rem; margin: 0 0 2px; }
    .sub { color: #888; font-size: .85rem; margin: 0 0 16px; }
    button {
      cursor: pointer; font: inherit; border: none; border-radius: 10px;
      padding: 8px 12px; font-weight: 600; background: #2563eb; color: #fff;
    }
    button.ghost { background: #8882; color: inherit; }
    button.sm { padding: 5px 9px; font-size: .8rem; }
    button:disabled { opacity: .5; cursor: progress; }

    .repo { border: 1px solid #8883; border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
    .repo-head {
      display: flex; align-items: center; gap: 10px; padding: 12px 14px; cursor: pointer;
      background: #8881;
    }
    .repo-head:hover { background: #8882; }
    .repo-name { font-weight: 700; }
    .repo-meta { color: #888; font-size: .78rem; }
    .repo-body { padding: 6px 10px 12px; display: none; }
    .repo.open .repo-body { display: block; }
    .caret { transition: transform .15s; }
    .repo.open .caret { transform: rotate(90deg); }

    .toolbar { display: flex; gap: 8px; align-items: center; margin: 6px 4px 10px; }
    .toolbar .spacer { flex: 1; }
    .muted { color: #888; font-size: .78rem; }

    .issue { border-top: 1px solid #8882; padding: 10px 4px; }
    .issue:first-child { border-top: none; }
    .issue-top { display: flex; align-items: flex-start; gap: 8px; }
    .issue-num { color: #888; font-variant-numeric: tabular-nums; font-size: .82rem; padding-top: 2px; }
    .issue-title { flex: 1; font-size: .92rem; }
    .labels { margin-top: 3px; }
    .label {
      display: inline-block; font-size: .68rem; padding: 1px 6px; border-radius: 999px;
      background: #8883; color: inherit; margin-right: 4px;
    }
    .actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }

    /* state dot buttons */
    .stbtn { display: inline-flex; align-items: center; gap: 6px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #9993; flex: none; }
    .st-idle    { background: #8882; color: inherit; }
    .st-working { background: #eab30833; color: #a16207; }
    .st-working .dot, .st-deploying .dot { background: #eab308; animation: pulse 1s infinite; }
    .st-deploying { background: #eab30833; color: #a16207; }
    .st-success { background: #16a34a22; color: #15803d; }
    .st-success .dot { background: #16a34a; }
    .st-failed  { background: #dc262622; color: #b91c1c; }
    .st-failed .dot { background: #dc2626; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

    .panel {
      margin-top: 8px; border: 1px solid #8883; border-radius: 10px; padding: 10px;
      background: #0b0b0e; color: #e6e6e6; font-family: ui-monospace, Menlo, monospace;
      font-size: .8rem; white-space: pre-wrap; word-break: break-word;
      max-height: 45vh; overflow-y: auto; display: none;
    }
    .panel.show { display: block; }
    .panel .stderr { color: #b9b9b9; }
    .panel .err { color: #ff6b6b; }
    .panel .ok { color: #6ee787; }
    .linkrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    a.btnlink {
      text-decoration: none; display: inline-block; padding: 7px 11px; border-radius: 10px;
      background: #8882; color: inherit; font-weight: 600; font-size: .82rem;
    }
    .err-inline { color: #dc2626; font-size: .8rem; padding: 8px 4px; }
    .mode-row { margin: 0; font-size: .8rem; color: #888; }
    select { font: inherit; padding: 5px 8px; border-radius: 8px; border: 1px solid #8884; background: #8881; }

    /* top bar with title + controls (filter lives top-right) */
    .topbar { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
    .topbar .grow { flex: 1; }
    .topctrls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
    .filter { position: relative; }
    .filter-menu {
      position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; min-width: 220px;
      background: Canvas; color: CanvasText; border: 1px solid #8884; border-radius: 10px;
      box-shadow: 0 8px 30px #0006; padding: 8px; display: none; max-height: 60vh; overflow-y: auto;
    }
    .filter-menu.show { display: block; }
    .filter-menu h4 { margin: 4px 6px 8px; font-size: .78rem; color: #888; font-weight: 600; }
    .filter-menu label {
      display: flex; align-items: center; gap: 8px; padding: 6px 6px; border-radius: 8px;
      font-size: .85rem; cursor: pointer;
    }
    .filter-menu label:hover { background: #8881; }
    .filter-actions { display: flex; gap: 6px; padding: 6px 6px 2px; border-top: 1px solid #8882; margin-top: 4px; }

    /* GitHub link beside the issue title */
    .issue-top { align-items: center; }
    a.ghlink {
      text-decoration: none; white-space: nowrap; padding: 5px 9px; border-radius: 9px;
      background: #8882; color: inherit; font-weight: 600; font-size: .78rem; flex: none;
    }

    /* per-PR rows: PR number on the left, Deploy on the right, one row per PR */
    .prlist { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
    .prrow {
      display: flex; align-items: center; gap: 8px; padding: 6px 8px;
      border: 1px solid #8883; border-radius: 10px; background: #8881;
    }
    .prrow .spacer { flex: 1; }
    a.prnum {
      text-decoration: none; font-weight: 700; font-size: .84rem; color: inherit;
      font-variant-numeric: tabular-nums;
    }
    .timing { color: #888; font-size: .72rem; font-variant-numeric: tabular-nums; }
    .prlist-empty { color: #888; font-size: .78rem; padding: 2px 4px; }

    /* tiny icon/log buttons */
    .iconbtn {
      cursor: pointer; font: inherit; border: 1px solid #8884; border-radius: 8px;
      padding: 3px 7px; font-size: .72rem; font-weight: 600; line-height: 1;
      background: #8881; color: inherit; flex: none;
    }
    .iconbtn:hover { background: #8883; }
    .iconbtn[hidden] { display: none; }

    /* success / failure indicated ON the issue, not on the button */
    .issue { border-left: 3px solid transparent; padding-left: 8px; transition: border-color .2s, opacity .2s; }
    .issue.ok { border-left-color: #16a34a; }
    .issue.ok .issue-num { color: #15803d; font-weight: 700; }
    .issue.fail { border-left-color: #dc2626; }
    .issue.fail .issue-num { color: #b91c1c; font-weight: 700; }

    /* blocked while another PR-creation runs in the same repo */
    .issue.blocked { opacity: .45; }
    .issue.blocked .actions, .issue.blocked .prlist { pointer-events: none; }
    .blocked-note { color: #a16207; font-size: .72rem; padding: 2px 4px; display: none; }
    .issue.blocked .blocked-note { display: block; }

    .pritem { display: flex; flex-direction: column; gap: 6px; }
    .prlog { margin-top: 0; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="grow">
      <h1>☁️ cloud-copilot</h1>
      <p class="sub" id="rootline">loading…</p>
    </div>
    <div class="topctrls">
      <div class="mode-row">
        mode:
        <select id="mode">
          <option value="allow-all" selected>Allow All</option>
          <option value="granular">Granular</option>
          <option value="default">Default</option>
        </select>
      </div>
      <div class="filter">
        <button id="filterBtn" class="ghost sm">⚙ Filter</button>
        <div id="filterMenu" class="filter-menu">
          <h4>Show repositories</h4>
          <div id="filterList"></div>
          <div class="filter-actions">
            <button id="filterAll" class="ghost sm">All</button>
            <button id="filterNone" class="ghost sm">None</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="repos"></div>

<script>
const reposEl = document.getElementById('repos');
const rootLine = document.getElementById('rootline');
const modeSel = document.getElementById('mode');
const filterBtn = document.getElementById('filterBtn');
const filterMenu = document.getElementById('filterMenu');
const filterList = document.getElementById('filterList');

const enc = encodeURIComponent;

const STATE_LABEL = {
  work:   { idle: 'Create PR', working: 'Creating PR…', success: 'PR created', failed: 'PR failed' },
  deploy: { idle: 'Deploy', deploying: 'Deploying…', success: 'Deployed', failed: 'Deploy failed' },
};
const STATE_CLASS = {
  idle: 'st-idle', working: 'st-working', deploying: 'st-deploying',
  success: 'st-success', failed: 'st-failed',
};

// ---- timing helpers -------------------------------------------------------
function fmtDur(ms) {
  if (ms == null) return '';
  const s = Math.round(ms / 1000);
  if (s < 60) return `${s}s`;
  const m = Math.floor(s / 60), r = s % 60;
  if (m < 60) return `${m}m ${r}s`;
  const h = Math.floor(m / 60);
  return `${h}h ${m % 60}m`;
}

// ---- per-device repo filter (persisted in localStorage) -------------------
const LS_HIDDEN = 'cc.hiddenRepos';
function hiddenSet() {
  try { return new Set(JSON.parse(localStorage.getItem(LS_HIDDEN) || '[]')); }
  catch { return new Set(); }
}
function saveHidden(set) {
  localStorage.setItem(LS_HIDDEN, JSON.stringify([...set]));
}
function applyRepoVisibility() {
  const hid = hiddenSet();
  document.querySelectorAll('.repo').forEach((el) => {
    el.style.display = hid.has(el.dataset.repo) ? 'none' : '';
  });
}
function renderFilterMenu(repos) {
  const hid = hiddenSet();
  filterList.innerHTML = '';
  for (const repo of repos) {
    const label = document.createElement('label');
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = !hid.has(repo.name);
    cb.addEventListener('change', () => {
      const set = hiddenSet();
      if (cb.checked) set.delete(repo.name); else set.add(repo.name);
      saveHidden(set);
      applyRepoVisibility();
    });
    label.appendChild(cb);
    label.appendChild(document.createTextNode(repo.name));
    filterList.appendChild(label);
  }
}
filterBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  filterMenu.classList.toggle('show');
});
document.addEventListener('click', (e) => {
  if (!filterMenu.contains(e.target) && e.target !== filterBtn) filterMenu.classList.remove('show');
});
document.getElementById('filterAll').addEventListener('click', () => {
  saveHidden(new Set());
  renderFilterMenu(window.__repos || []);
  applyRepoVisibility();
});
document.getElementById('filterNone').addEventListener('click', () => {
  saveHidden(new Set((window.__repos || []).map((r) => r.name)));
  renderFilterMenu(window.__repos || []);
  applyRepoVisibility();
});

// ---- repos ----------------------------------------------------------------
async function loadRepos() {
  const r = await fetch('/api/repos').then((x) => x.json());
  window.__repos = r.repos;
  rootLine.textContent = `authorized root: ${r.root} · ${r.repos.length} repos`;
  reposEl.innerHTML = '';
  for (const repo of r.repos) reposEl.appendChild(renderRepo(repo));
  renderFilterMenu(r.repos);
  applyRepoVisibility();
}

function renderRepo(repo) {
  const el = document.createElement('div');
  el.className = 'repo';
  el.dataset.repo = repo.name;
  el.innerHTML = `
    <div class="repo-head">
      <span class="caret">▶</span>
      <span class="repo-name">${escape(repo.name)}</span>
      <span class="repo-meta">${repo.ownerRepo ? escape(repo.ownerRepo) : 'no github remote'} · ${escape(repo.branch || '')}</span>
    </div>
    <div class="repo-body"><div class="muted" style="padding:8px 4px">Click to load issues…</div></div>`;
  const head = el.querySelector('.repo-head');
  const body = el.querySelector('.repo-body');
  let loaded = false;
  head.addEventListener('click', async () => {
    el.classList.toggle('open');
    if (el.classList.contains('open') && !loaded && repo.github) {
      loaded = true;
      await loadIssues(repo, body);
    }
  });
  if (!repo.github) {
    body.innerHTML = '<div class="muted" style="padding:8px 4px">No github.com remote — issues unavailable.</div>';
  }
  return el;
}

async function loadIssues(repo, body, force = false) {
  body.innerHTML = '<div class="muted" style="padding:8px 4px">Loading issues…</div>';
  let data;
  try {
    data = await fetch(`/api/repos/${enc(repo.name)}/issues${force ? '?refresh=1' : ''}`)
      .then((x) => x.json());
  } catch (e) {
    body.innerHTML = `<div class="err-inline">Failed to load: ${escape(e.message)}</div>`;
    return;
  }
  if (data.error) {
    body.innerHTML = `<div class="err-inline">${escape(data.error)}</div>`;
    return;
  }
  const toolbar = document.createElement('div');
  toolbar.className = 'toolbar';
  const when = data.at ? new Date(data.at).toLocaleTimeString() : '';
  toolbar.innerHTML = `<span class="muted">${data.issues.length} open · ${data.cached ? 'cached' : 'fresh'} ${when}</span><span class="spacer"></span>`;
  const refresh = document.createElement('button');
  refresh.className = 'ghost sm';
  refresh.textContent = '↻ Refresh';
  refresh.addEventListener('click', () => loadIssues(repo, body, true));
  toolbar.appendChild(refresh);

  body.innerHTML = '';
  body.appendChild(toolbar);

  // Per-repo context enforcing "one PR creation at a time" and greying out the
  // other issues in this repo while one is in progress.
  const repoCtx = {
    activeWorkIssue: (data.activeWorkIssues && data.activeWorkIssues[0]) ?? null,
    issues: [],
    update() {
      for (const ic of this.issues) {
        ic.setBlocked(this.activeWorkIssue != null && ic.issueNumber !== this.activeWorkIssue);
      }
    },
    setActive(n) { this.activeWorkIssue = n; this.update(); },
    clearActive(n) { if (this.activeWorkIssue === n) { this.activeWorkIssue = null; this.update(); } },
  };

  for (const issue of data.issues) body.appendChild(renderIssue(repo, issue, repoCtx));
  repoCtx.update();
}

function renderIssue(repo, issue, repoCtx) {
  const el = document.createElement('div');
  el.className = 'issue';
  const labels = (issue.labels || [])
    .map((l) => `<span class="label">${escape(l)}</span>`)
    .join('');
  el.innerHTML = `
    <div class="issue-top">
      <span class="issue-num">#${issue.number}</span>
      <div class="issue-title">${escape(issue.title)}
        <div class="labels">${labels}</div>
      </div>
      <a class="ghlink" target="_blank" rel="noopener">↗ GitHub</a>
    </div>
    <div class="actions"></div>
    <div class="worklog panel"></div>
    <div class="blocked-note">⏸ Waiting — another PR creation is running in this repo…</div>
    <div class="prlist"></div>`;

  const actions = el.querySelector('.actions');
  const prlist = el.querySelector('.prlist');
  const worklog = el.querySelector('.worklog');
  const ghLink = el.querySelector('.ghlink');
  ghLink.href = issue.url;

  // Per-issue live state. `st.prs` is an array of { prNumber, prUrl, deploy }.
  const st = issue.status || { work: { status: 'idle' }, prs: [] };
  if (!st.prs) st.prs = [];
  if (!st.work) st.work = { status: 'idle' };

  // --- Create PR button + its log toggle -----------------------------------
  const workBtn = document.createElement('button');
  workBtn.addEventListener('click', onWork);

  const workLogBtn = document.createElement('button');
  workLogBtn.className = 'iconbtn';
  workLogBtn.textContent = '▤ log';
  workLogBtn.title = 'Show PR-creation logs';
  workLogBtn.hidden = true;
  workLogBtn.addEventListener('click', async () => {
    const show = !worklog.classList.contains('show');
    worklog.classList.toggle('show', show);
    if (show && !worklog.textContent.trim() && (st.work.status === 'success' || st.work.status === 'failed')) {
      await loadWorkTranscript();
    }
  });

  const refreshPrsBtn = document.createElement('button');
  refreshPrsBtn.className = 'ghost sm';
  refreshPrsBtn.textContent = '↻ PRs';
  refreshPrsBtn.title = 'Refresh PR list from GitHub';
  refreshPrsBtn.addEventListener('click', async () => {
    refreshPrsBtn.disabled = true;
    try {
      const d = await fetch(`/api/repos/${enc(repo.name)}/issues/${issue.number}/prs`).then((x) => x.json());
      if (d.prs) mergePrs(d.prs);
    } catch { /* ignore */ } finally { refreshPrsBtn.disabled = false; }
  });

  actions.append(workBtn, workLogBtn, refreshPrsBtn);

  paintWork(st.work.status);
  renderPrs();

  // Register with the repo-level lock so we can be greyed out / re-enabled.
  repoCtx.issues.push({ issueNumber: issue.number, setBlocked });

  // Re-attach to any jobs still running server-side after a reload/reconnect.
  if (st.work.status === 'working') streamWork(true);
  for (const pr of st.prs) {
    if (pr.deploy && pr.deploy.status === 'deploying') streamDeploy(pr.prNumber, true);
  }

  // --- blocking -------------------------------------------------------------
  function setBlocked(blocked) {
    el.classList.toggle('blocked', blocked);
    workBtn.disabled = blocked;
    refreshPrsBtn.disabled = blocked;
  }

  // --- Create PR visuals: success/fail shown ON THE ISSUE, not the button ---
  function paintWork(status) {
    const visual = status === 'working' ? 'working' : 'idle'; // button stays "Create PR"
    paintBtn(workBtn, 'work', visual, st.work);
    el.classList.toggle('ok', status === 'success');
    el.classList.toggle('fail', status === 'failed');
    const hasLog = status === 'working' || status === 'success' || status === 'failed' || st.work.hasConversation;
    workLogBtn.hidden = !hasLog;
  }

  // --- PR rows (each with its own collapsible deploy log) -------------------
  function findPr(n) { return st.prs.find((p) => p.prNumber === n); }
  function deployPanel(n) { return prlist.querySelector(`.pritem[data-pr="${n}"] .prlog`); }
  function deployBtnEl(n) { return prlist.querySelector(`.pritem[data-pr="${n}"] .prrow .stbtn`); }

  function renderPrs() {
    prlist.innerHTML = '';
    if (!st.prs.length) {
      prlist.innerHTML = '<div class="prlist-empty">No PRs yet — use Create PR above.</div>';
      return;
    }
    for (const pr of st.prs) prlist.appendChild(renderPrRow(pr));
  }

  function renderPrRow(pr) {
    const item = document.createElement('div');
    item.className = 'pritem';
    item.dataset.pr = pr.prNumber;

    const row = document.createElement('div');
    row.className = 'prrow';

    const link = document.createElement('a');
    link.className = 'prnum';
    link.href = pr.prUrl || '#';
    link.target = '_blank'; link.rel = 'noopener';
    link.textContent = `PR #${pr.prNumber}`;

    const logBtn = document.createElement('button');
    logBtn.className = 'iconbtn prlog-toggle';
    logBtn.textContent = '▤ logs';
    logBtn.title = 'Show deploy logs';

    const timing = document.createElement('span');
    timing.className = 'timing';
    if (pr.deploy && pr.deploy.durationMs != null) timing.textContent = `ran ${fmtDur(pr.deploy.durationMs)}`;

    const spacer = document.createElement('span');
    spacer.className = 'spacer';

    const deployBtn = document.createElement('button');
    paintBtn(deployBtn, 'deploy', (pr.deploy && pr.deploy.status) || 'idle', pr.deploy);
    deployBtn.addEventListener('click', () => onDeploy(pr.prNumber));

    const deployLogBtn = document.createElement('button');
    deployLogBtn.className = 'iconbtn prlog-toggle';
    deployLogBtn.textContent = '▤';
    deployLogBtn.title = 'Show deploy logs';

    const prlog = document.createElement('div');
    prlog.className = 'prlog panel';

    const toggleLog = async () => {
      const show = !prlog.classList.contains('show');
      prlog.classList.toggle('show', show);
      const cur = findPr(pr.prNumber);
      const s = cur && cur.deploy && cur.deploy.status;
      if (show && !prlog.textContent.trim() && (s === 'success' || s === 'failed')) {
        await loadDeployTranscript(pr.prNumber);
      }
    };
    logBtn.addEventListener('click', toggleLog);
    deployLogBtn.addEventListener('click', toggleLog);

    const s0 = (pr.deploy && pr.deploy.status) || 'idle';
    const showLog0 = s0 === 'deploying' || (pr.deploy && pr.deploy.hasConversation) || s0 === 'success' || s0 === 'failed';
    logBtn.hidden = !showLog0;
    deployLogBtn.hidden = !showLog0;

    row.append(link, logBtn, timing, spacer, deployBtn, deployLogBtn);
    item.append(row, prlog);
    return item;
  }

  function paintDeploy(prNumber) {
    const pr = findPr(prNumber);
    if (!pr) return;
    const s = (pr.deploy && pr.deploy.status) || 'idle';
    const btn = deployBtnEl(prNumber);
    if (btn) paintBtn(btn, 'deploy', s, pr.deploy);
    const showLog = s === 'deploying' || (pr.deploy && pr.deploy.hasConversation) || s === 'success' || s === 'failed';
    prlist.querySelectorAll(`.pritem[data-pr="${prNumber}"] .prlog-toggle`).forEach((b) => { b.hidden = !showLog; });
    if (pr.deploy && pr.deploy.durationMs != null) setPrTiming(prNumber, pr.deploy.durationMs);
  }

  function setPrTiming(prNumber, durationMs) {
    const t = prlist.querySelector(`.pritem[data-pr="${prNumber}"] .timing`);
    if (t && durationMs != null) t.textContent = `ran ${fmtDur(durationMs)}`;
  }

  function paintBtn(btn, action, s, timingObj) {
    btn.className = `stbtn ${STATE_CLASS[s] || 'st-idle'}`;
    btn.innerHTML = `<span class="dot"></span>${STATE_LABEL[action][s] || s}`;
    const dur = timingObj && timingObj.durationMs;
    btn.title = dur != null ? `ran ${fmtDur(dur)}` : '';
  }

  function mergePrs(list) {
    st.prs = list.map((p) => {
      const ex = st.prs.find((x) => x.prNumber === p.prNumber);
      return {
        prNumber: p.prNumber, prUrl: p.prUrl, title: p.title, createdAt: p.createdAt,
        deploy: ex ? ex.deploy : (p.deploy || { status: 'idle' }),
      };
    });
    renderPrs();
  }

  function upsertLocalPr(p) {
    if (!st.prs.find((x) => x.prNumber === p.prNumber)) {
      st.prs.unshift({ prNumber: p.prNumber, prUrl: p.prUrl, deploy: { status: 'idle' } });
      renderPrs();
    }
  }

  // --- Create PR flow -------------------------------------------------------
  async function onWork() {
    const s = st.work.status;
    if (s === 'working') return void worklog.classList.toggle('show');
    // Enforce the repo-level lock on the client too.
    if (repoCtx.activeWorkIssue != null && repoCtx.activeWorkIssue !== issue.number) return;
    st.work.status = 'working';
    paintWork('working');
    await streamWork(false);
  }

  async function streamWork(reconnect) {
    if (reconnect) { st.work.status = 'working'; paintWork('working'); appendWork('\n[reconnecting work…]\n', 'stderr'); }
    const url = `/api/repos/${enc(repo.name)}/issues/${issue.number}/work`;
    let finalStatus = null, resultData = null;
    try {
      const resp = await fetch(url, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode: modeSel.value }),
      });
      if (!resp.ok || !resp.body) { appendWork(`\n[error] HTTP ${resp.status}\n`, 'err'); return reconcileWork(); }
      await pumpSSE(resp, {
        onMeta: () => repoCtx.setActive(issue.number),
        onChunk: (t, s) => appendWork(t, s === 'stderr' ? 'stderr' : null),
        onError: (m) => appendWork(`\n[error] ${m}\n`, 'err'),
        onResult: (d) => { finalStatus = d.status; resultData = d; },
      });
    } catch (e) {
      appendWork(`\n[connection dropped: ${e.message}] — job still running, checking status…\n`, 'stderr');
      return reconcileWork();
    }
    if (finalStatus === 'blocked') {
      st.work.status = 'idle';
      paintWork('idle');
      worklog.classList.add('show');
      appendWork(`\n${resultData.message || 'blocked'}\n`, 'err');
      return;
    }
    if (finalStatus) {
      st.work.status = finalStatus;
      st.work.hasConversation = true;
      paintWork(finalStatus);
      if (resultData && resultData.prNumber) upsertLocalPr({ prNumber: resultData.prNumber, prUrl: resultData.prUrl });
      appendWork(`\n[work] finished: ${finalStatus}\n`, finalStatus === 'success' ? 'ok' : 'err');
      repoCtx.clearActive(issue.number);
    } else {
      return reconcileWork();
    }
  }

  async function reconcileWork() {
    for (let i = 0; i < 200; i++) {
      let rec;
      try { rec = await fetchRecord(); } catch { await sleep(3000); continue; }
      const s = rec.work.status;
      if (s === 'success' || s === 'failed') {
        st.work.status = s; st.work.hasConversation = true; paintWork(s); syncPrsFromRecord(rec);
        appendWork(`\n[work] finished: ${s}\n`, s === 'success' ? 'ok' : 'err');
        repoCtx.clearActive(issue.number);
        return;
      }
      if (rec.live && rec.live.work) { repoCtx.setActive(issue.number); return streamWork(true); }
      await sleep(3000);
    }
    appendWork(`\n[work] status check timed out — tap Create PR again to re-check.\n`, 'stderr');
    repoCtx.clearActive(issue.number);
  }

  // --- Deploy flow (per PR) -------------------------------------------------
  async function onDeploy(prNumber) {
    const pr = findPr(prNumber);
    if (!pr) return;
    const s = (pr.deploy && pr.deploy.status) || 'idle';
    if (s === 'deploying') { const p = deployPanel(prNumber); if (p) p.classList.toggle('show'); return; }
    if (s === 'success' || s === 'failed') return loadDeployTranscript(prNumber);
    pr.deploy.status = 'deploying';
    paintDeploy(prNumber);
    await streamDeploy(prNumber, false);
  }

  async function streamDeploy(prNumber, reconnect) {
    const pr = findPr(prNumber);
    if (!pr) return;
    if (reconnect) { pr.deploy.status = 'deploying'; paintDeploy(prNumber); appendDeploy(prNumber, `\n[reconnecting deploy PR #${prNumber}…]\n`, 'stderr'); }
    const url = `/api/repos/${enc(repo.name)}/issues/${issue.number}/deploy/${prNumber}`;
    let finalStatus = null;
    try {
      const resp = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
      if (!resp.ok || !resp.body) { appendDeploy(prNumber, `\n[error] HTTP ${resp.status}\n`, 'err'); return reconcileDeploy(prNumber); }
      await pumpSSE(resp, {
        onChunk: (t, s) => appendDeploy(prNumber, t, s === 'stderr' ? 'stderr' : null),
        onError: (m) => appendDeploy(prNumber, `\n[error] ${m}\n`, 'err'),
        onResult: (d) => { finalStatus = d.status; },
      });
    } catch (e) {
      appendDeploy(prNumber, `\n[connection dropped: ${e.message}] — deploy still running, checking status…\n`, 'stderr');
      return reconcileDeploy(prNumber);
    }
    if (finalStatus) {
      pr.deploy.status = finalStatus;
      pr.deploy.hasConversation = true;
      paintDeploy(prNumber);
      appendDeploy(prNumber, `\n[deploy #${prNumber}] finished: ${finalStatus}\n`, finalStatus === 'success' ? 'ok' : 'err');
      refreshDeployTiming(prNumber);
    } else {
      return reconcileDeploy(prNumber);
    }
  }

  async function reconcileDeploy(prNumber) {
    for (let i = 0; i < 200; i++) {
      let rec;
      try { rec = await fetchRecord(); } catch { await sleep(3000); continue; }
      const prRec = (rec.prs || {})[prNumber];
      const s = prRec && prRec.deploy && prRec.deploy.status;
      if (s === 'success' || s === 'failed') {
        const pr = findPr(prNumber);
        if (pr) pr.deploy = { ...prRec.deploy };
        paintDeploy(prNumber);
        appendDeploy(prNumber, `\n[deploy #${prNumber}] finished: ${s}\n`, s === 'success' ? 'ok' : 'err');
        return;
      }
      if (rec.live && rec.live.deploy && rec.live.deploy[prNumber]) return streamDeploy(prNumber, true);
      await sleep(3000);
    }
    appendDeploy(prNumber, `\n[deploy #${prNumber}] status check timed out — tap Deploy again.\n`, 'stderr');
  }

  async function refreshDeployTiming(prNumber) {
    try {
      const rec = await fetchRecord();
      const prRec = (rec.prs || {})[prNumber];
      const pr = findPr(prNumber);
      if (prRec && pr) { pr.deploy = { ...prRec.deploy }; paintDeploy(prNumber); }
    } catch { /* ignore */ }
  }

  // --- shared helpers -------------------------------------------------------
  function fetchRecord() {
    return fetch(`/api/repos/${enc(repo.name)}/issues/${issue.number}/record`).then((x) => x.json());
  }

  function syncPrsFromRecord(rec) {
    const arr = Object.values(rec.prs || {})
      .sort((a, b) => b.prNumber - a.prNumber)
      .map((p) => ({ prNumber: p.prNumber, prUrl: p.prUrl, title: p.title, createdAt: p.createdAt, deploy: { ...p.deploy } }));
    st.prs = arr;
    renderPrs();
  }

  async function loadWorkTranscript() {
    worklog.classList.add('show');
    worklog.innerHTML = '<span class="stderr">loading transcript…</span>';
    const rec = await fetchRecord();
    worklog.innerHTML = '';
    appendWork(rec.work.conversation || '(no transcript stored yet)', rec.work.conversation ? null : 'stderr');
  }

  async function loadDeployTranscript(prNumber) {
    const panelEl = deployPanel(prNumber);
    if (!panelEl) return;
    panelEl.classList.add('show');
    panelEl.innerHTML = '<span class="stderr">loading transcript…</span>';
    const rec = await fetchRecord();
    panelEl.innerHTML = '';
    const prRec = (rec.prs || {})[prNumber];
    const conv = prRec && prRec.deploy && prRec.deploy.conversation;
    appendTo(panelEl, conv || '(no transcript stored yet)', conv ? null : 'stderr');
  }

  function appendTo(panelEl, text, cls) {
    const span = document.createElement('span');
    if (cls) span.className = cls;
    span.textContent = text;
    panelEl.appendChild(span);
    panelEl.scrollTop = panelEl.scrollHeight;
  }
  function appendWork(text, cls) { appendTo(worklog, text, cls); }
  function appendDeploy(prNumber, text, cls) { const p = deployPanel(prNumber); if (p) appendTo(p, text, cls); }

  function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }

  return el;
}

// Read an SSE response body, dispatching parsed events to handlers.
async function pumpSSE(resp, { onChunk, onError, onResult, onMeta }) {
  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buf = '';
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    let sep;
    while ((sep = buf.indexOf('\n\n')) !== -1) {
      const raw = buf.slice(0, sep);
      buf = buf.slice(sep + 2);
      const evt = parseEvent(raw);
      if (!evt) continue;
      if (evt.event === 'chunk') onChunk && onChunk(evt.data.text, evt.data.stream);
      else if (evt.event === 'meta') onMeta && onMeta(evt.data);
      else if (evt.event === 'error') onError && onError(evt.data.message);
      else if (evt.event === 'result') onResult && onResult(evt.data);
    }
  }
}

function parseEvent(raw) {
  let event = 'message';
  let dataLine = '';
  for (const line of raw.split('\n')) {
    if (line.startsWith('event:')) event = line.slice(6).trim();
    else if (line.startsWith('data:')) dataLine += line.slice(5).trim();
  }
  if (!dataLine) return null;
  try { return { event, data: JSON.parse(dataLine) }; } catch { return null; }
}

function escape(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

loadRepos();
</script>
