<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>cloud-copilot · issues console</title>
  <style>
    :root { color-scheme: light dark; --gap: 12px; }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 860px; margin: 0 auto; padding: 16px 14px 60px; line-height: 1.45;
    }
    h1 { font-size: 1.3rem; margin: 0 0 2px; }
    .sub { color: #888; font-size: .85rem; margin: 0 0 16px; }
    button {
      cursor: pointer; font: inherit; border: none; border-radius: 10px;
      padding: 8px 12px; font-weight: 600; background: #2563eb; color: #fff;
    }
    button.ghost { background: #8882; color: inherit; }
    button.sm { padding: 5px 9px; font-size: .8rem; }
    button:disabled { opacity: .5; cursor: progress; }

    .repo { border: 1px solid #8883; border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
    .repo-head {
      display: flex; align-items: center; gap: 10px; padding: 12px 14px; cursor: pointer;
      background: #8881;
    }
    .repo-head:hover { background: #8882; }
    .repo-name { font-weight: 700; }
    .repo-meta { color: #888; font-size: .78rem; }
    .repo-body { padding: 6px 10px 12px; display: none; }
    .repo.open .repo-body { display: block; }
    .caret { transition: transform .15s; }
    .repo.open .caret { transform: rotate(90deg); }

    .toolbar { display: flex; gap: 8px; align-items: center; margin: 6px 4px 10px; }
    .toolbar .spacer { flex: 1; }
    .muted { color: #888; font-size: .78rem; }

    .issue { border-top: 1px solid #8882; padding: 10px 4px; }
    .issue:first-child { border-top: none; }
    /* Header row (badge/number/buttons) and title are separate rows, so a
       long wrapping title never squeezes/misaligns the badge or buttons. */
    .issue-top { display: flex; flex-direction: column; gap: 4px; }
    .issue-toprow { display: flex; align-items: center; gap: 8px; }
    .issue-toprow .spacer { flex: 1; }
    .issue-num { color: #888; font-variant-numeric: tabular-nums; font-size: .82rem; }
    .issue-title { font-size: .92rem; }
    .labels { margin-top: 3px; }
    .label {
      display: inline-block; font-size: .68rem; padding: 1px 6px; border-radius: 999px;
      background: #8883; color: inherit; margin-right: 4px;
    }
    .actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }

    /* state dot buttons — blue=planned, yellow=running, green=done, red=failed */
    .stbtn { display: inline-flex; align-items: center; gap: 6px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #2563eb; flex: none; }
    .st-idle    { background: #2563eb22; color: #1d4ed8; }
    .st-idle .dot { background: #2563eb; }
    .st-working { background: #eab30833; color: #a16207; }
    .st-working .dot, .st-deploying .dot, .st-merging .dot { background: #eab308; animation: pulse 1s infinite; }
    .st-deploying, .st-merging { background: #eab30833; color: #a16207; }
    .st-success { background: #16a34a22; color: #15803d; }
    .st-success .dot { background: #16a34a; }
    .st-failed  { background: #dc262622; color: #b91c1c; }
    .st-failed .dot { background: #dc2626; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

    /* Create PR → Deploy → Merge as a connected chevron/arrow step bar */
    .pritem { margin-top: 4px; }
    .prheadrow { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .chevbar { display: flex; width: 100%; }
    .chev {
      flex: 1; display: flex; align-items: center; justify-content: center;
      height: 34px; min-width: 0; color: #fff; font-weight: 700; font-size: .74rem;
      border: none; cursor: pointer; font: inherit; padding: 0 14px; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
      clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 0 100%, 14px 50%);
      margin-right: -13px;
    }
    .chev:first-child {
      clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 0 100%);
      padding-left: 12px;
    }
    .chev:last-child { margin-right: 0; }
    .chev:nth-child(1) { z-index: 3; }
    .chev:nth-child(2) { z-index: 2; }
    .chev:nth-child(3) { z-index: 1; }
    .chev-idle     { background: #2563eb; }
    .chev-working, .chev-deploying, .chev-merging { background: #eab308; color: #4a3600; }
    .chev-success  { background: #16a34a; }
    .chev-failed, .chev-aborted { background: #dc2626; }
    .chev-locked   { background: #93a3b8; color: #eef2f7; opacity: .85; }
    .chevtools {
      display: flex; margin-top: 6px; font-size: .74rem; color: #888;
    }
    .chevtool { flex: 1; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .chevtool:first-child { justify-content: flex-start; }
    .chevtool:not(:first-child) { justify-content: center; }

    /* floating pipeline-depth control — stays put while the page scrolls */
    .depth-fab {
      position: fixed; bottom: 16px; right: 16px; z-index: 40; border-radius: 999px;
      padding: 9px 13px; box-shadow: 0 6px 20px #0004;
    }
    .depth-drawer {
      position: fixed; top: 0; right: 0; height: 100%; width: min(280px, 86vw); z-index: 41;
      background: Canvas; color: CanvasText; border-left: 1px solid #8884; box-shadow: -8px 0 30px #0006;
      padding: 18px 16px; transform: translateX(100%); transition: transform .2s ease; overflow-y: auto;
    }
    .depth-drawer.show { transform: translateX(0); }
    .depth-drawer h3 { margin: 0 0 4px; font-size: 1rem; }
    .depth-drawer .hint { color: #888; font-size: .78rem; margin: 0 0 14px; }
    .depth-option {
      display: flex; align-items: flex-start; gap: 10px; padding: 10px 8px; border-radius: 10px;
      cursor: pointer; margin-bottom: 6px;
    }
    .depth-option:hover { background: #8881; }
    .depth-option input { margin-top: 3px; }
    .depth-option .lbl { font-weight: 600; font-size: .88rem; }
    .depth-option .desc { color: #888; font-size: .76rem; margin-top: 2px; }
    .depth-scrim {
      position: fixed; inset: 0; z-index: 40; background: #0004; display: none;
    }
    .depth-scrim.show { display: block; }

    .panel {
      margin-top: 8px; border: 1px solid #8883; border-radius: 10px; padding: 10px;
      background: #0b0b0e; color: #e6e6e6; font-family: ui-monospace, Menlo, monospace;
      font-size: .8rem; white-space: pre-wrap; word-break: break-word;
      max-height: 45vh; overflow-y: auto; display: none;
    }
    .panel.show { display: block; }
    .panel .stderr { color: #b9b9b9; }
    .panel .err { color: #ff6b6b; }
    .panel .ok { color: #6ee787; }
    .linkrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    a.btnlink {
      text-decoration: none; display: inline-block; padding: 7px 11px; border-radius: 10px;
      background: #8882; color: inherit; font-weight: 600; font-size: .82rem;
    }
    .err-inline { color: #dc2626; font-size: .8rem; padding: 8px 4px; }
    .mode-row { margin: 0; font-size: .8rem; color: #888; }
    select { font: inherit; padding: 5px 8px; border-radius: 8px; border: 1px solid #8884; background: #8881; }

    /* top bar with title + controls (filter lives top-right) */
    .topbar { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
    .topbar .grow { flex: 1; }
    .topctrls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
    .filter { position: relative; }
    .filter-menu {
      position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; min-width: 220px;
      background: Canvas; color: CanvasText; border: 1px solid #8884; border-radius: 10px;
      box-shadow: 0 8px 30px #0006; padding: 8px; display: none; max-height: 60vh; overflow-y: auto;
    }
    .filter-menu.show { display: block; }
    .filter-menu h4 { margin: 4px 6px 8px; font-size: .78rem; color: #888; font-weight: 600; }
    .filter-menu label {
      display: flex; align-items: center; gap: 8px; padding: 6px 6px; border-radius: 8px;
      font-size: .85rem; cursor: pointer;
    }
    .filter-menu label:hover { background: #8881; }
    .filter-actions { display: flex; gap: 6px; padding: 6px 6px 2px; border-top: 1px solid #8882; margin-top: 4px; }

    /* GitHub link beside the issue title */
    a.ghlink {
      text-decoration: none; white-space: nowrap; padding: 5px 9px; border-radius: 9px;
      background: #8882; color: inherit; font-weight: 600; font-size: .78rem; flex: none;
    }

    /* pin-to-top toggle — sized for tapping, like the other icon buttons */
    .pinbtn {
      cursor: pointer; font: inherit; border: 1px solid #8884; border-radius: 9px;
      min-height: 36px; min-width: 36px; padding: 6px 10px; font-size: 1rem; line-height: 1;
      background: #8881; color: inherit; flex: none; opacity: .45; filter: grayscale(1);
      touch-action: manipulation;
    }
    .pinbtn:hover { background: #8883; }
    .pinbtn.active { opacity: 1; filter: none; background: #eab30833; border-color: #eab30899; }

    /* repo name badge shown on cards inside the Pinned section (out of context) */
    .repo-badge {
      background: #2563eb22; color: #1d4ed8; font-size: .72rem; font-weight: 700;
      padding: 3px 8px; border-radius: 999px; flex: none;
    }

    /* pinned-issues section, above the repo list */
    #pinnedSection { margin-bottom: 16px; }
    .pinned-title { font-size: .95rem; margin: 0 0 8px; }
    #pinnedSection .issue {
      border: 1px solid #8883; border-radius: 12px; padding: 10px 12px; margin-bottom: 8px;
    }

    /* PR detail page (#/pr/<repo>/<issue>/<pr>) */
    #prDetailView { max-width: 860px; margin: 0 auto; padding: 16px 14px 60px; }
    #prDetailView .issue {
      border: 1px solid #8883; border-radius: 12px; padding: 10px 12px; margin-bottom: 14px;
    }
    a.backlink {
      display: inline-block; margin-bottom: 12px; color: inherit; text-decoration: none;
      font-weight: 600; font-size: .85rem; opacity: .75;
    }
    a.backlink:hover { opacity: 1; }
    .pr-detail-extra { display: flex; flex-direction: column; gap: 16px; }
    .history-panel, .chat-panel {
      border: 1px solid #8883; border-radius: 12px; padding: 12px 14px;
    }
    .history-panel h3, .chat-panel h3 { margin: 0 0 10px; font-size: .92rem; }
    .history-list { display: flex; flex-direction: column; gap: 6px; }
    .history-row {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: 8px 10px; border-radius: 9px; font-size: .8rem;
    }
    .history-status { font-weight: 700; }

    .chat-messages {
      display: flex; flex-direction: column; gap: 10px; max-height: 50vh; overflow-y: auto;
      margin-bottom: 10px;
    }
    .chat-bubble { padding: 8px 11px; border-radius: 10px; font-size: .85rem; }
    .chat-bubble.chat-user { background: #2563eb18; align-self: flex-end; max-width: 85%; }
    .chat-bubble.chat-assistant { background: #8881; max-width: 100%; }
    .chat-meta { font-size: .68rem; color: #888; margin-bottom: 3px; text-transform: uppercase; letter-spacing: .02em; }
    .chat-text { white-space: pre-wrap; word-break: break-word; font-family: ui-monospace, Menlo, monospace; font-size: .8rem; }
    .chat-inputrow { display: flex; flex-direction: column; gap: 8px; }
    .chat-input {
      width: 100%; font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid #8884;
      background: #8881; color: inherit; resize: vertical; min-height: 60px;
    }
    .chat-actions { display: flex; gap: 8px; align-items: center; }
    .chat-empty { color: #888; font-size: .8rem; padding: 4px 0 10px; }

    /* per-PR rows: PR number on the left, Deploy on the right, one row per PR */
    .prlist { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
    .prrow {
      display: flex; align-items: center; gap: 8px; padding: 6px 8px;
      border: 1px solid #8883; border-radius: 10px; background: #8881;
    }
    .prrow .spacer { flex: 1; }
    a.prnum {
      text-decoration: none; font-weight: 700; font-size: .84rem; color: inherit;
      font-variant-numeric: tabular-nums;
    }
    .timing { color: #888; font-size: .72rem; font-variant-numeric: tabular-nums; }
    .prlist-empty { color: #888; font-size: .78rem; padding: 2px 4px; }

    /* icon/log buttons — sized for comfortable tapping, not just clicking */
    .iconbtn {
      cursor: pointer; font: inherit; border: 1px solid #8884; border-radius: 9px;
      padding: 8px 12px; min-height: 36px; min-width: 36px; font-size: .82rem; font-weight: 600;
      line-height: 1; background: #8881; color: inherit; flex: none; touch-action: manipulation;
    }
    .iconbtn:hover { background: #8883; }
    .iconbtn[hidden] { display: none; }
    .abortbtn { border-color: #dc262699; color: #dc2626; }
    .abortbtn:hover { background: #dc262622; }

    /* success / failure indicated ON the issue, not on the button */
    .issue { border-left: 3px solid transparent; padding-left: 8px; transition: border-color .2s, opacity .2s; }
    .issue.ok { border-left-color: #16a34a; }
    .issue.ok .issue-num { color: #15803d; font-weight: 700; }
    .issue.fail { border-left-color: #dc2626; }
    .issue.fail .issue-num { color: #b91c1c; font-weight: 700; }

    /* blocked while another PR-creation runs in the same repo */
    .issue.blocked { opacity: .45; }
    .issue.blocked .actions, .issue.blocked .prlist { pointer-events: none; }
    .blocked-note { color: #a16207; font-size: .72rem; padding: 2px 4px; display: none; }
    .issue.blocked .blocked-note { display: block; }

    .pritem { display: flex; flex-direction: column; gap: 6px; }
    .prlog { margin-top: 0; }
  </style>
</head>
<body>
  <div id="mainView">
    <div class="topbar">
      <div class="grow">
        <h1>☁️ cloud-copilot</h1>
        <p class="sub" id="rootline">loading…</p>
      </div>
      <div class="topctrls">
        <div class="mode-row">
          mode:
          <select id="mode">
            <option value="allow-all" selected>Allow All</option>
            <option value="granular">Granular</option>
            <option value="default">Default</option>
          </select>
        </div>
        <div class="filter">
          <button id="filterBtn" class="ghost sm">⚙ Filter</button>
          <div id="filterMenu" class="filter-menu">
            <h4>Show repositories</h4>
            <div id="filterList"></div>
            <div class="filter-actions">
              <button id="filterAll" class="ghost sm">All</button>
              <button id="filterNone" class="ghost sm">None</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="pinnedSection" style="display:none"></div>
    <div id="repos"></div>
  </div>

  <div id="prDetailView" style="display:none"></div>

  <button id="depthFab" class="ghost depth-fab" title="Set pipeline auto-run depth">⏩ Depth</button>
  <div id="depthScrim" class="depth-scrim"></div>
  <div id="depthDrawer" class="depth-drawer">
    <h3>Auto-run depth</h3>
    <p class="hint">Clicking Create PR runs one stage after another, automatically, until it reaches the depth you pick here. A stage only advances on success.</p>
    <label class="depth-option">
      <input type="radio" name="depth" value="pr">
      <span><span class="lbl">Create PR only</span><div class="desc">Stop once the PR is created (today's behavior).</div></span>
    </label>
    <label class="depth-option">
      <input type="radio" name="depth" value="deploy">
      <span><span class="lbl">…through Deploy</span><div class="desc">After Create PR succeeds, automatically run Deploy.</div></span>
    </label>
    <label class="depth-option">
      <input type="radio" name="depth" value="merge">
      <span><span class="lbl">…through Merge</span><div class="desc">Keep going through Deploy, then Merge, with no more clicks.</div></span>
    </label>
  </div>

<script>
const reposEl = document.getElementById('repos');
const rootLine = document.getElementById('rootline');
const modeSel = document.getElementById('mode');
const filterBtn = document.getElementById('filterBtn');
const filterMenu = document.getElementById('filterMenu');
const filterList = document.getElementById('filterList');

const enc = encodeURIComponent;

const STATE_LABEL = {
  work:   { idle: 'Create PR', working: 'Creating PR…', success: 'PR created', failed: 'PR failed', aborted: 'PR aborted' },
  deploy: { idle: 'Deploy', deploying: 'Deploying…', success: 'Deployed', failed: 'Deploy failed', aborted: 'Aborted' },
  merge:  { idle: 'Merge', merging: 'Merging…', success: 'Merged', failed: 'Merge failed', aborted: 'Merge aborted' },
};
const STATE_CLASS = {
  idle: 'st-idle', working: 'st-working', deploying: 'st-deploying', merging: 'st-merging',
  success: 'st-success', failed: 'st-failed', aborted: 'st-failed',
};
const CHEV_CLASS = {
  idle: 'chev-idle', working: 'chev-working', deploying: 'chev-deploying', merging: 'chev-merging',
  success: 'chev-success', failed: 'chev-failed', aborted: 'chev-aborted',
};

// ---- pipeline auto-run depth (persisted in localStorage) -------------------
const LS_DEPTH = 'cc.pipelineDepth';
function pipelineDepth() {
  const v = localStorage.getItem(LS_DEPTH);
  return v === 'deploy' || v === 'merge' ? v : 'pr';
}
function setPipelineDepth(v) { localStorage.setItem(LS_DEPTH, v); }

const depthFab = document.getElementById('depthFab');
const depthDrawer = document.getElementById('depthDrawer');
const depthScrim = document.getElementById('depthScrim');
function syncDepthRadios() {
  document.querySelectorAll('input[name="depth"]').forEach((r) => { r.checked = r.value === pipelineDepth(); });
}
function openDepthDrawer() { syncDepthRadios(); depthDrawer.classList.add('show'); depthScrim.classList.add('show'); }
function closeDepthDrawer() { depthDrawer.classList.remove('show'); depthScrim.classList.remove('show'); }
depthFab.addEventListener('click', openDepthDrawer);
depthScrim.addEventListener('click', closeDepthDrawer);
document.querySelectorAll('input[name="depth"]').forEach((r) => {
  r.addEventListener('change', () => { if (r.checked) setPipelineDepth(r.value); });
});
syncDepthRadios();

// ---- timing helpers -------------------------------------------------------
function fmtDur(ms) {
  if (ms == null) return '';
  const s = Math.round(ms / 1000);
  if (s < 60) return `${s}s`;
  const m = Math.floor(s / 60), r = s % 60;
  if (m < 60) return `${m}m ${r}s`;
  const h = Math.floor(m / 60);
  return `${h}h ${m % 60}m`;
}

// ---- per-device repo filter (persisted in localStorage) -------------------
const LS_HIDDEN = 'cc.hiddenRepos';
function hiddenSet() {
  try { return new Set(JSON.parse(localStorage.getItem(LS_HIDDEN) || '[]')); }
  catch { return new Set(); }
}
function saveHidden(set) {
  localStorage.setItem(LS_HIDDEN, JSON.stringify([...set]));
}
function applyRepoVisibility() {
  const hid = hiddenSet();
  document.querySelectorAll('.repo').forEach((el) => {
    el.style.display = hid.has(el.dataset.repo) ? 'none' : '';
  });
}
function renderFilterMenu(repos) {
  const hid = hiddenSet();
  filterList.innerHTML = '';
  for (const repo of repos) {
    const label = document.createElement('label');
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = !hid.has(repo.name);
    cb.addEventListener('change', () => {
      const set = hiddenSet();
      if (cb.checked) set.delete(repo.name); else set.add(repo.name);
      saveHidden(set);
      applyRepoVisibility();
    });
    label.appendChild(cb);
    label.appendChild(document.createTextNode(repo.name));
    filterList.appendChild(label);
  }
}
filterBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  filterMenu.classList.toggle('show');
});
document.addEventListener('click', (e) => {
  if (!filterMenu.contains(e.target) && e.target !== filterBtn) filterMenu.classList.remove('show');
});
document.getElementById('filterAll').addEventListener('click', () => {
  saveHidden(new Set());
  renderFilterMenu(window.__repos || []);
  applyRepoVisibility();
});
document.getElementById('filterNone').addEventListener('click', () => {
  saveHidden(new Set((window.__repos || []).map((r) => r.name)));
  renderFilterMenu(window.__repos || []);
  applyRepoVisibility();
});

// ---- pinned issues (persisted in localStorage, shown at the top) ----------
const LS_PINS = 'cc.pinnedIssues';
const pinnedSection = document.getElementById('pinnedSection');
function getPins() {
  try { return JSON.parse(localStorage.getItem(LS_PINS) || '[]'); }
  catch { return []; }
}
function setPins(list) { localStorage.setItem(LS_PINS, JSON.stringify(list)); }
function isPinned(repo, n) { return getPins().some((p) => p.repo === repo && p.issueNumber === n); }
function togglePin(repo, n) {
  const pins = getPins();
  const idx = pins.findIndex((p) => p.repo === repo && p.issueNumber === n);
  if (idx >= 0) pins.splice(idx, 1); else pins.unshift({ repo, issueNumber: n });
  setPins(pins);
  renderPinnedSection();
}

async function renderPinnedSection() {
  const pins = getPins();
  if (!pins.length) { pinnedSection.style.display = 'none'; pinnedSection.innerHTML = ''; return; }
  pinnedSection.style.display = '';
  pinnedSection.innerHTML = '<h2 class="pinned-title">📌 Pinned</h2><div id="pinnedList" class="muted" style="padding:4px">Loading…</div>';
  const cards = [];
  for (const pin of pins) {
    const repoObj = (window.__repos || []).find((r) => r.name === pin.repo);
    if (!repoObj) continue;
    try {
      const data = await fetch(`/api/repos/${enc(pin.repo)}/issues`).then((x) => x.json());
      const issue = (data.issues || []).find((i) => i.number === pin.issueNumber);
      if (!issue) continue;
      const repoCtx = createRepoCtx((data.activeWorkIssues && data.activeWorkIssues[0]) ?? null);
      cards.push(renderIssue(repoObj, issue, repoCtx, { pinned: true }));
    } catch { /* ignore — that repo/issue just won't show up in the pinned list */ }
  }
  const list = document.getElementById('pinnedList');
  list.className = '';
  list.innerHTML = '';
  if (!cards.length) {
    list.innerHTML = '<div class="muted" style="padding:4px 0">No pinned issues found (may have been closed).</div>';
    return;
  }
  for (const c of cards) list.appendChild(c);
}

// ---- repos ----------------------------------------------------------------
async function loadRepos() {
  const r = await fetch('/api/repos').then((x) => x.json());
  window.__repos = r.repos;
  rootLine.textContent = `authorized root: ${r.root} · ${r.repos.length} repos`;
  reposEl.innerHTML = '';
  for (const repo of r.repos) reposEl.appendChild(renderRepo(repo));
  renderFilterMenu(r.repos);
  applyRepoVisibility();
  renderPinnedSection();
}

function renderRepo(repo) {
  const el = document.createElement('div');
  el.className = 'repo';
  el.dataset.repo = repo.name;
  el.innerHTML = `
    <div class="repo-head">
      <span class="caret">▶</span>
      <span class="repo-name">${escape(repo.name)}</span>
      <span class="repo-meta">${repo.ownerRepo ? escape(repo.ownerRepo) : 'no github remote'} · ${escape(repo.branch || '')}</span>
    </div>
    <div class="repo-body"><div class="muted" style="padding:8px 4px">Click to load issues…</div></div>`;
  const head = el.querySelector('.repo-head');
  const body = el.querySelector('.repo-body');
  let loaded = false;
  head.addEventListener('click', async () => {
    el.classList.toggle('open');
    if (el.classList.contains('open') && !loaded && repo.github) {
      loaded = true;
      await loadIssues(repo, body);
    }
  });
  if (!repo.github) {
    body.innerHTML = '<div class="muted" style="padding:8px 4px">No github.com remote — issues unavailable.</div>';
  }
  return el;
}

async function loadIssues(repo, body, force = false) {
  body.innerHTML = '<div class="muted" style="padding:8px 4px">Loading issues…</div>';
  let data;
  try {
    data = await fetch(`/api/repos/${enc(repo.name)}/issues${force ? '?refresh=1' : ''}`)
      .then((x) => x.json());
  } catch (e) {
    body.innerHTML = `<div class="err-inline">Failed to load: ${escape(e.message)}</div>`;
    return;
  }
  if (data.error) {
    body.innerHTML = `<div class="err-inline">${escape(data.error)}</div>`;
    return;
  }
  const toolbar = document.createElement('div');
  toolbar.className = 'toolbar';
  const when = data.at ? new Date(data.at).toLocaleTimeString() : '';
  toolbar.innerHTML = `<span class="muted">${data.issues.length} open · ${data.cached ? 'cached' : 'fresh'} ${when}</span><span class="spacer"></span>`;
  const refresh = document.createElement('button');
  refresh.className = 'ghost sm';
  refresh.textContent = '↻ Refresh';
  refresh.addEventListener('click', () => loadIssues(repo, body, true));
  toolbar.appendChild(refresh);

  body.innerHTML = '';
  body.appendChild(toolbar);

  // Per-repo context enforcing "one working-tree action (Create PR / Deploy /
  // Chat) at a time" and greying out everything else in this repo while one
  // is in progress.
  const repoCtx = createRepoCtx((data.activeWorkIssues && data.activeWorkIssues[0]) ?? null);

  for (const issue of data.issues) body.appendChild(renderIssue(repo, issue, repoCtx));
  repoCtx.update();
}

// Shared per-repo lock context: only one working-tree action (Create PR,
// Deploy, or Chat) may be active per repo at a time; every other issue/PR in
// that repo gets greyed out (`setBlocked`) while one is running. Used by the
// repo list, the Pinned section, and the PR detail page alike, seeded from
// the same `activeWorkIssues` field the server already returns — so a
// pinned/detail card correctly starts greyed out if something else in that
// repo is already busy, instead of the old no-op stub that never blocked.
function createRepoCtx(initialBusyIssue) {
  return {
    activeWorkIssue: initialBusyIssue ?? null,
    issues: [],
    update() {
      for (const ic of this.issues) {
        ic.setBlocked(this.activeWorkIssue != null && ic.issueNumber !== this.activeWorkIssue);
      }
    },
    setActive(n) { this.activeWorkIssue = n; this.update(); },
    clearActive(n) { if (this.activeWorkIssue === n) { this.activeWorkIssue = null; this.update(); } },
  };
}

function renderIssue(repo, issue, repoCtx, opts = {}) {
  const el = document.createElement('div');
  el.className = 'issue';
  const labels = (issue.labels || [])
    .map((l) => `<span class="label">${escape(l)}</span>`)
    .join('');
  el.innerHTML = `
    <div class="issue-top">
      <div class="issue-toprow">
        ${opts.pinned ? `<span class="repo-badge">${escape(repo.name)}</span>` : ''}
        <span class="issue-num">#${issue.number}</span>
        <span class="spacer"></span>
        <button class="pinbtn" title="Pin to top">📌</button>
        <a class="ghlink" target="_blank" rel="noopener">↗ GitHub</a>
      </div>
      <div class="issue-title">${escape(issue.title)}
        <div class="labels">${labels}</div>
      </div>
    </div>
    <div class="actions"></div>
    <div class="worklog panel"></div>
    <div class="blocked-note">⏸ Waiting — another PR creation is running in this repo…</div>
    <div class="prlist"></div>`;

  const actions = el.querySelector('.actions');
  const prlist = el.querySelector('.prlist');
  const worklog = el.querySelector('.worklog');
  const ghLink = el.querySelector('.ghlink');
  ghLink.href = issue.url;

  const pinBtn = el.querySelector('.pinbtn');
  const paintPin = () => pinBtn.classList.toggle('active', isPinned(repo.name, issue.number));
  paintPin();
  pinBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    togglePin(repo.name, issue.number);
    paintPin();
  });

  // Per-issue live state. `st.prs` is an array of { prNumber, prUrl, deploy }.
  const st = issue.status || { work: { status: 'idle' }, prs: [] };
  if (!st.prs) st.prs = [];
  if (!st.work) st.work = { status: 'idle' };

  // --- Create PR button + its log toggle -----------------------------------
  const workBtn = document.createElement('button');
  workBtn.addEventListener('click', onWork);

  const workLogBtn = document.createElement('button');
  workLogBtn.className = 'iconbtn';
  workLogBtn.textContent = '▤ log';
  workLogBtn.title = 'Show PR-creation logs';
  workLogBtn.hidden = true;
  workLogBtn.addEventListener('click', async () => {
    const show = !worklog.classList.contains('show');
    worklog.classList.toggle('show', show);
    if (show && !worklog.textContent.trim() && (st.work.status === 'success' || st.work.status === 'failed' || st.work.status === 'aborted')) {
      await loadWorkTranscript();
    }
  });

  const workAbortBtn = document.createElement('button');
  workAbortBtn.className = 'iconbtn abortbtn';
  workAbortBtn.textContent = '⨯ Abort';
  workAbortBtn.title = 'Abort PR creation';
  workAbortBtn.hidden = true;
  workAbortBtn.addEventListener('click', onWorkAbort);

  const refreshPrsBtn = document.createElement('button');
  refreshPrsBtn.className = 'ghost sm';
  refreshPrsBtn.textContent = '↻ PRs';
  refreshPrsBtn.title = 'Refresh PR list from GitHub';
  refreshPrsBtn.addEventListener('click', async () => {
    refreshPrsBtn.disabled = true;
    try {
      const d = await fetch(`/api/repos/${enc(repo.name)}/issues/${issue.number}/prs`).then((x) => x.json());
      if (d.prs) mergePrs(d.prs);
    } catch { /* ignore */ } finally { refreshPrsBtn.disabled = false; }
  });

  actions.append(workBtn, workAbortBtn, workLogBtn, refreshPrsBtn);

  paintWork(st.work.status);
  renderPrs();

  // Register with the repo-level lock so we can be greyed out / re-enabled.
  repoCtx.issues.push({ issueNumber: issue.number, setBlocked });

  // Re-attach to any jobs still running server-side after a reload/reconnect.
  // IMPORTANT: go through reconcile*(), which checks the server's live-job
  // flag FIRST — never call stream*(true) directly here. A stored status of
  // "working"/"deploying" only means the job *was* running; if the server
  // process has since restarted (job state is in-memory only), a blind
  // stream*(true) POST looks identical to a fresh click and silently starts a
  // brand-new copilot/deploy run. Rendering the same issue twice (e.g. once
  // pinned, once in the repo list) doubles this risk, which is how a single
  // stuck "Creating PR…" turned into two real duplicate PRs (#109 and #110).
  if (st.work.status === 'working') reconcileWork();
  for (const pr of st.prs) {
    if (pr.deploy && pr.deploy.status === 'deploying') reconcileDeploy(pr.prNumber);
    if (pr.merge && pr.merge.status === 'merging') reconcileMerge(pr.prNumber);
  }

  // --- blocking -------------------------------------------------------------
  function setBlocked(blocked) {
    el.classList.toggle('blocked', blocked);
    workBtn.disabled = blocked;
    refreshPrsBtn.disabled = blocked;
  }

  // --- Create PR visuals: success/fail shown ON THE ISSUE, not the button ---
  function paintWork(status) {
    const visual = status === 'working' ? 'working' : 'idle'; // button stays "Create PR"
    paintBtn(workBtn, 'work', visual, st.work);
    el.classList.toggle('ok', status === 'success');
    el.classList.toggle('fail', status === 'failed' || status === 'aborted');
    const hasLog = status === 'working' || status === 'success' || status === 'failed' || status === 'aborted' || st.work.hasConversation;
    workLogBtn.hidden = !hasLog;
    workAbortBtn.hidden = status !== 'working';
    updateAllPrWorkTimings();
  }

  // --- PR rows: 3-column pipeline (Create PR | Deploy | Merge), each with its
  // own collapsible log ------------------------------------------------------
  function findPr(n) { return st.prs.find((p) => p.prNumber === n); }
  function deployPanel(n) { return prlist.querySelector(`.pritem[data-pr="${n}"] .prlog`); }
  function mergePanel(n) { return prlist.querySelector(`.pritem[data-pr="${n}"] .mergelog`); }
  function chevEl(n, col) { return prlist.querySelector(`.pritem[data-pr="${n}"] .chev-col-${col}`); }
  function toolEl(n, col) { return prlist.querySelector(`.pritem[data-pr="${n}"] .chevtool-${col}`); }

  function renderPrs() {
    prlist.innerHTML = '';
    if (!st.prs.length) {
      prlist.innerHTML = '<div class="prlist-empty">No PRs yet — use Create PR above.</div>';
      return;
    }
    for (const pr of st.prs) prlist.appendChild(renderPrRow(pr));
  }

  // One connected Create PR → Deploy → Merge chevron/arrow step bar per PR,
  // with a slim tools row underneath for each stage's log toggle / abort /
  // timing (kept off the chevron itself so the step-bar stays clean).
  function renderPrRow(pr) {
    const item = document.createElement('div');
    item.className = 'pritem';
    item.dataset.pr = pr.prNumber;

    const headRow = document.createElement('div');
    headRow.className = 'prheadrow';
    const link = document.createElement('a');
    link.className = 'prnum';
    link.href = `#/pr/${enc(repo.name)}/${issue.number}/${pr.prNumber}`;
    link.title = 'Open PR detail page';
    link.textContent = `PR #${pr.prNumber}`;
    const ghIcon = document.createElement('a');
    ghIcon.className = 'ghlink';
    ghIcon.href = pr.prUrl || '#';
    ghIcon.target = '_blank'; ghIcon.rel = 'noopener';
    ghIcon.textContent = '↗';
    ghIcon.title = 'Open on GitHub';
    headRow.append(link, ghIcon);

    const prlog = document.createElement('div');
    prlog.className = 'prlog panel';
    const mergelog = document.createElement('div');
    mergelog.className = 'mergelog panel';

    const chevbar = document.createElement('div');
    chevbar.className = 'chevbar';

    // --- Segment 1: Create PR (read-only reflection of the issue-level work
    // status — the actual trigger is the Create PR button above) -----------
    const prSeg = document.createElement('button');
    prSeg.title = 'Toggle Create PR logs';
    prSeg.addEventListener('click', () => worklog.classList.toggle('show'));

    // --- Segment 2: Deploy ---------------------------------------------------
    const deploySeg = document.createElement('button');
    deploySeg.addEventListener('click', () => onDeploy(pr.prNumber));

    // --- Segment 3: Merge (locked/dimmed until Deploy succeeds) -------------
    const mergeSeg = document.createElement('button');
    mergeSeg.addEventListener('click', () => onMerge(pr.prNumber));

    chevbar.append(prSeg, deploySeg, mergeSeg);

    // --- tools row: per-stage log toggle / abort / timing -------------------
    const tools = document.createElement('div');
    tools.className = 'chevtools';

    const prTool = document.createElement('span');
    prTool.className = 'chevtool chevtool-pr';
    const prLogBtn = document.createElement('button');
    prLogBtn.className = 'iconbtn prlog-toggle-shared';
    prLogBtn.textContent = '▤';
    prLogBtn.title = 'Show PR-creation logs';
    prLogBtn.addEventListener('click', () => worklog.classList.toggle('show'));
    const prTiming = document.createElement('span');
    prTiming.className = 'timing';
    if (st.work.durationMs != null) prTiming.textContent = `ran ${fmtDur(st.work.durationMs)}`;
    prTool.append(prLogBtn, prTiming);

    const deployTool = document.createElement('span');
    deployTool.className = 'chevtool chevtool-deploy';
    const deployLogBtn = document.createElement('button');
    deployLogBtn.className = 'iconbtn prlog-toggle';
    deployLogBtn.textContent = '▤';
    deployLogBtn.title = 'Show deploy logs';
    const deployAbortBtn = document.createElement('button');
    deployAbortBtn.className = 'iconbtn abortbtn';
    deployAbortBtn.textContent = '⨯';
    deployAbortBtn.title = 'Abort this deploy';
    deployAbortBtn.addEventListener('click', () => onAbort(pr.prNumber));
    const deployTiming = document.createElement('span');
    deployTiming.className = 'timing';
    if (pr.deploy && pr.deploy.durationMs != null) deployTiming.textContent = `ran ${fmtDur(pr.deploy.durationMs)}`;
    const toggleDeployLog = async () => {
      const show = !prlog.classList.contains('show');
      prlog.classList.toggle('show', show);
      const cur = findPr(pr.prNumber);
      const s = cur && cur.deploy && cur.deploy.status;
      if (show && !prlog.textContent.trim() && (s === 'success' || s === 'failed' || s === 'aborted')) {
        await loadDeployTranscript(pr.prNumber);
      }
    };
    deployLogBtn.addEventListener('click', toggleDeployLog);
    deployTool.append(deployLogBtn, deployAbortBtn, deployTiming);

    const mergeTool = document.createElement('span');
    mergeTool.className = 'chevtool chevtool-merge';
    const mergeLogBtn = document.createElement('button');
    mergeLogBtn.className = 'iconbtn mergelog-toggle';
    mergeLogBtn.textContent = '▤';
    mergeLogBtn.title = 'Show merge logs';
    const mergeAbortBtn = document.createElement('button');
    mergeAbortBtn.className = 'iconbtn abortbtn';
    mergeAbortBtn.textContent = '⨯';
    mergeAbortBtn.title = 'Abort this merge';
    mergeAbortBtn.addEventListener('click', () => onMergeAbort(pr.prNumber));
    const mergeTiming = document.createElement('span');
    mergeTiming.className = 'timing';
    if (pr.merge && pr.merge.durationMs != null) mergeTiming.textContent = `ran ${fmtDur(pr.merge.durationMs)}`;
    const toggleMergeLog = async () => {
      const show = !mergelog.classList.contains('show');
      mergelog.classList.toggle('show', show);
      const cur = findPr(pr.prNumber);
      const s = cur && cur.merge && cur.merge.status;
      if (show && !mergelog.textContent.trim() && (s === 'success' || s === 'failed' || s === 'aborted')) {
        await loadMergeTranscript(pr.prNumber);
      }
    };
    mergeLogBtn.addEventListener('click', toggleMergeLog);
    mergeTool.append(mergeLogBtn, mergeAbortBtn, mergeTiming);

    tools.append(prTool, deployTool, mergeTool);
    item.append(headRow, chevbar, tools, prlog, mergelog);

    // Initial paint. The "Create PR" cell always reads success: this row only
    // exists because a PR was found, so its own creation is a done deal —
    // regardless of the issue's shared work.status, which may currently be
    // "working" for an unrelated, still-running Create PR run (or reflect an
    // older/different PR entirely, e.g. one merely referencing this issue).
    paintChev(prSeg, 'chev-col-pr', 'work', 'success', st.work);
    paintChev(deploySeg, 'chev-col-deploy', 'deploy', (pr.deploy && pr.deploy.status) || 'idle', pr.deploy);
    paintChevMerge(mergeSeg, pr);

    const hasWorkLog = st.work.status === 'working' || st.work.status === 'success' || st.work.status === 'failed' || st.work.status === 'aborted' || st.work.hasConversation;
    prLogBtn.hidden = !hasWorkLog;
    const s0 = (pr.deploy && pr.deploy.status) || 'idle';
    const showDeployLog0 = s0 === 'deploying' || (pr.deploy && pr.deploy.hasConversation) || s0 === 'success' || s0 === 'failed' || s0 === 'aborted';
    deployLogBtn.hidden = !showDeployLog0;
    deployAbortBtn.hidden = s0 !== 'deploying';
    const m0 = (pr.merge && pr.merge.status) || 'idle';
    const showMergeLog0 = m0 === 'merging' || (pr.merge && pr.merge.hasConversation) || m0 === 'success' || m0 === 'failed' || m0 === 'aborted';
    mergeLogBtn.hidden = !showMergeLog0;
    mergeAbortBtn.hidden = m0 !== 'merging';

    return item;
  }

  function paintChev(el, colClass, action, s, timingObj) {
    el.className = `chev ${colClass} ${CHEV_CLASS[s] || 'chev-idle'}`;
    let label = STATE_LABEL[action][s] || s;
    if (action === 'deploy' && timingObj && (timingObj.buildNumber || timingObj.version)) {
      const bits = [timingObj.buildNumber ? `#${timingObj.buildNumber}` : null, timingObj.version ? `v${timingObj.version}` : null].filter(Boolean);
      if (bits.length) label += ` · ${bits.join(' ')}`;
    }
    el.textContent = label;
    const dur = timingObj && timingObj.durationMs;
    el.title = dur != null ? `ran ${fmtDur(dur)}` : '';
  }

  // Merge's segment reads BOTH its own status and Deploy's status: it stays a
  // dimmed/locked step until Deploy succeeds, then becomes a normal actionable
  // segment. Clicking while locked still works (force-merge, with a confirm) —
  // it's just visually deprioritized until Deploy clears it.
  function paintChevMerge(el, pr) {
    const ms = (pr.merge && pr.merge.status) || 'idle';
    const deployOk = pr.deploy && pr.deploy.status === 'success';
    if (ms === 'idle' && !deployOk) {
      el.className = 'chev chev-col-merge chev-locked';
      el.textContent = '🔒 Merge';
      el.title = 'Deploy has not succeeded yet — click to force-merge anyway';
    } else {
      paintChev(el, 'chev-col-merge', 'merge', ms, pr.merge);
    }
  }

  function paintDeploy(prNumber) {
    const pr = findPr(prNumber);
    if (!pr) return;
    const s = (pr.deploy && pr.deploy.status) || 'idle';
    const el = chevEl(prNumber, 'deploy');
    if (el) paintChev(el, 'chev-col-deploy', 'deploy', s, pr.deploy);
    const showLog = s === 'deploying' || (pr.deploy && pr.deploy.hasConversation) || s === 'success' || s === 'failed' || s === 'aborted';
    const tool = toolEl(prNumber, 'deploy');
    if (tool) {
      const logBtn = tool.querySelector('.prlog-toggle'); if (logBtn) logBtn.hidden = !showLog;
      const abort = tool.querySelector('.abortbtn'); if (abort) abort.hidden = s !== 'deploying';
    }
    if (pr.deploy && pr.deploy.durationMs != null) setPrTiming(prNumber, pr.deploy.durationMs);
    // Deploy's outcome changes whether Merge is locked — repaint it too.
    paintMerge(prNumber);
  }

  function paintMerge(prNumber) {
    const pr = findPr(prNumber);
    if (!pr) return;
    const el = chevEl(prNumber, 'merge');
    if (el) paintChevMerge(el, pr);
    const ms = (pr.merge && pr.merge.status) || 'idle';
    const showLog = ms === 'merging' || (pr.merge && pr.merge.hasConversation) || ms === 'success' || ms === 'failed' || ms === 'aborted';
    const tool = toolEl(prNumber, 'merge');
    if (tool) {
      const logBtn = tool.querySelector('.mergelog-toggle'); if (logBtn) logBtn.hidden = !showLog;
      const abort = tool.querySelector('.abortbtn'); if (abort) abort.hidden = ms !== 'merging';
    }
    if (pr.merge && pr.merge.durationMs != null) setMergeTiming(prNumber, pr.merge.durationMs);
  }

  function setPrTiming(prNumber, durationMs) {
    const t = prlist.querySelector(`.pritem[data-pr="${prNumber}"] .chevtool-deploy .timing`);
    if (t && durationMs != null) t.textContent = `ran ${fmtDur(durationMs)}`;
  }

  // Create PR's duration is shared across every PR row for this issue (one
  // work record, not per-PR) — update all of them in one pass.
  function updateAllPrWorkTimings() {
    if (st.work.durationMs == null) return;
    const text = `ran ${fmtDur(st.work.durationMs)}`;
    prlist.querySelectorAll('.chevtool-pr .timing').forEach((t) => { t.textContent = text; });
  }

  function setMergeTiming(prNumber, durationMs) {
    const t = prlist.querySelector(`.pritem[data-pr="${prNumber}"] .chevtool-merge .timing`);
    if (t && durationMs != null) t.textContent = `ran ${fmtDur(durationMs)}`;
  }

  function paintBtn(btn, action, s, timingObj) {
    btn.className = `stbtn ${STATE_CLASS[s] || 'st-idle'}`;
    let extra = '';
    if (action === 'deploy' && timingObj && (timingObj.buildNumber || timingObj.version)) {
      const bits = [timingObj.buildNumber ? `build ${timingObj.buildNumber}` : null, timingObj.version ? `v${timingObj.version}` : null].filter(Boolean);
      if (bits.length) extra = ` <span class="muted">· ${bits.join(' · ')}</span>`;
    }
    btn.innerHTML = `<span class="dot"></span>${STATE_LABEL[action][s] || s}${extra}`;
    const dur = timingObj && timingObj.durationMs;
    btn.title = dur != null ? `ran ${fmtDur(dur)}` : '';
  }

  function mergePrs(list) {
    st.prs = list.map((p) => {
      const ex = st.prs.find((x) => x.prNumber === p.prNumber);
      return {
        prNumber: p.prNumber, prUrl: p.prUrl, title: p.title, createdAt: p.createdAt,
        deploy: ex ? ex.deploy : (p.deploy || { status: 'idle' }),
        merge: ex ? ex.merge : (p.merge || { status: 'idle' }),
      };
    });
    renderPrs();
  }

  function upsertLocalPr(p) {
    if (!st.prs.find((x) => x.prNumber === p.prNumber)) {
      st.prs.unshift({ prNumber: p.prNumber, prUrl: p.prUrl, deploy: { status: 'idle' }, merge: { status: 'idle' } });
      renderPrs();
    }
  }

  // --- Create PR flow -------------------------------------------------------
  async function onWork() {
    const s = st.work.status;
    if (s === 'working') return void worklog.classList.toggle('show');
    // Enforce the repo-level lock on the client too.
    if (repoCtx.activeWorkIssue != null && repoCtx.activeWorkIssue !== issue.number) return;
    st.work.status = 'working';
    paintWork('working');
    await streamWork(false);
  }

  async function onWorkAbort() {
    if (st.work.status !== 'working') return;
    if (!window.confirm(`Abort creating PR for issue #${issue.number}?`)) return;
    appendWork('\n[abort requested…]\n', 'stderr');
    try {
      await fetch(`/api/repos/${enc(repo.name)}/issues/${issue.number}/work/cancel`, { method: 'POST' });
    } catch (e) {
      appendWork(`\n[abort failed: ${e.message}]\n`, 'err');
    }
  }

  async function streamWork(reconnect) {
    if (reconnect) { st.work.status = 'working'; paintWork('working'); appendWork('\n[reconnecting work…]\n', 'stderr'); }
    const url = `/api/repos/${enc(repo.name)}/issues/${issue.number}/work`;
    let finalStatus = null, resultData = null;
    try {
      const resp = await fetch(url, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode: modeSel.value }),
      });
      if (!resp.ok || !resp.body) { appendWork(`\n[error] HTTP ${resp.status}\n`, 'err'); return reconcileWork(); }
      await pumpSSE(resp, {
        onMeta: () => repoCtx.setActive(issue.number),
        onChunk: (t, s) => appendWork(t, s === 'stderr' ? 'stderr' : null),
        onError: (m) => appendWork(`\n[error] ${m}\n`, 'err'),
        onResult: (d) => { finalStatus = d.status; resultData = d; },
      });
    } catch (e) {
      appendWork(`\n[connection dropped: ${e.message}] — job still running, checking status…\n`, 'stderr');
      return reconcileWork();
    }
    if (finalStatus === 'blocked') {
      st.work.status = 'idle';
      paintWork('idle');
      worklog.classList.add('show');
      appendWork(`\n${resultData.message || 'blocked'}\n`, 'err');
      return;
    }
    if (finalStatus) {
      st.work.status = finalStatus;
      st.work.hasConversation = true;
      paintWork(finalStatus);
      if (resultData && resultData.prNumber) upsertLocalPr({ prNumber: resultData.prNumber, prUrl: resultData.prUrl });
      appendWork(`\n[work] finished: ${finalStatus}\n`, finalStatus === 'success' ? 'ok' : 'err');
      repoCtx.clearActive(issue.number);
      // Auto-run depth: a successful Create PR keeps going into Deploy (and
      // from there possibly Merge) unless depth is "Create PR only".
      if (finalStatus === 'success' && resultData && resultData.prNumber && pipelineDepth() !== 'pr') {
        onDeploy(resultData.prNumber);
      }
    } else {
      return reconcileWork();
    }
  }

  async function reconcileWork() {
    for (let i = 0; i < 200; i++) {
      let rec;
      try { rec = await fetchRecord(); } catch { await sleep(3000); continue; }
      const s = rec.work.status;
      if (s === 'success' || s === 'failed' || s === 'aborted') {
        st.work.status = s; st.work.hasConversation = true; paintWork(s); syncPrsFromRecord(rec);
        appendWork(`\n[work] finished: ${s}\n`, s === 'success' ? 'ok' : 'err');
        repoCtx.clearActive(issue.number);
        if (s === 'success' && rec.work.prNumber && pipelineDepth() !== 'pr') onDeploy(rec.work.prNumber);
        return;
      }
      if (rec.live && rec.live.work) { repoCtx.setActive(issue.number); return streamWork(true); }
      await sleep(3000);
    }
    appendWork(`\n[work] status check timed out — tap Create PR again to re-check.\n`, 'stderr');
    repoCtx.clearActive(issue.number);
  }

  // --- Deploy flow (per PR) -------------------------------------------------
  async function onDeploy(prNumber) {
    const pr = findPr(prNumber);
    if (!pr) return;
    const s = (pr.deploy && pr.deploy.status) || 'idle';
    if (s === 'deploying') { const p = deployPanel(prNumber); if (p) p.classList.toggle('show'); return; }
    // Enforce the repo-level lock on the client too — Deploy checks out a
    // branch on the same shared working tree as Create PR/Chat.
    if (repoCtx.activeWorkIssue != null && repoCtx.activeWorkIssue !== issue.number) return;
    // Finished runs require confirmation before starting a fresh TestFlight build.
    if (s === 'success' || s === 'failed' || s === 'aborted') {
      const verb = (s === 'failed' || s === 'aborted') ? 'Re-deploy' : 'Deploy again';
      if (!window.confirm(`${verb} PR #${prNumber}? This starts a new TestFlight build.`)) return;
    }
    pr.deploy.status = 'deploying';
    paintDeploy(prNumber);
    await streamDeploy(prNumber, false);
  }

  async function onAbort(prNumber) {
    const pr = findPr(prNumber);
    if (!pr || !pr.deploy || pr.deploy.status !== 'deploying') return;
    if (!window.confirm(`Abort the current deploy for PR #${prNumber}?`)) return;
    appendDeploy(prNumber, `\n[abort requested…]\n`, 'stderr');
    try {
      await fetch(`/api/repos/${enc(repo.name)}/issues/${issue.number}/deploy/${prNumber}/cancel`, { method: 'POST' });
    } catch (e) {
      appendDeploy(prNumber, `\n[abort failed: ${e.message}]\n`, 'err');
    }
  }

  async function streamDeploy(prNumber, reconnect) {
    const pr = findPr(prNumber);
    if (!pr) return;
    if (reconnect) { pr.deploy.status = 'deploying'; paintDeploy(prNumber); appendDeploy(prNumber, `\n[reconnecting deploy PR #${prNumber}…]\n`, 'stderr'); }
    const url = `/api/repos/${enc(repo.name)}/issues/${issue.number}/deploy/${prNumber}`;
    let finalStatus = null, resultData = null;
    try {
      const resp = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
      if (!resp.ok || !resp.body) { appendDeploy(prNumber, `\n[error] HTTP ${resp.status}\n`, 'err'); return reconcileDeploy(prNumber); }
      await pumpSSE(resp, {
        onMeta: () => repoCtx.setActive(issue.number),
        onChunk: (t, s) => appendDeploy(prNumber, t, s === 'stderr' ? 'stderr' : null),
        onError: (m) => appendDeploy(prNumber, `\n[error] ${m}\n`, 'err'),
        onResult: (d) => { finalStatus = d.status; resultData = d; },
      });
    } catch (e) {
      appendDeploy(prNumber, `\n[connection dropped: ${e.message}] — deploy still running, checking status…\n`, 'stderr');
      return reconcileDeploy(prNumber);
    }
    if (finalStatus === 'blocked') {
      pr.deploy.status = 'idle';
      paintDeploy(prNumber);
      const p = deployPanel(prNumber); if (p) p.classList.add('show');
      appendDeploy(prNumber, `\n${(resultData && resultData.message) || 'blocked'}\n`, 'err');
      return;
    }
    if (finalStatus) {
      pr.deploy.status = finalStatus;
      pr.deploy.hasConversation = true;
      paintDeploy(prNumber);
      appendDeploy(prNumber, `\n[deploy #${prNumber}] finished: ${finalStatus}\n`, finalStatus === 'success' ? 'ok' : 'err');
      refreshDeployTiming(prNumber);
      repoCtx.clearActive(issue.number);
      if (finalStatus === 'success' && pipelineDepth() === 'merge') onMerge(prNumber);
    } else {
      return reconcileDeploy(prNumber);
    }
  }

  async function reconcileDeploy(prNumber) {
    for (let i = 0; i < 200; i++) {
      let rec;
      try { rec = await fetchRecord(); } catch { await sleep(3000); continue; }
      const prRec = (rec.prs || {})[prNumber];
      const s = prRec && prRec.deploy && prRec.deploy.status;
      if (s === 'success' || s === 'failed' || s === 'aborted') {
        const pr = findPr(prNumber);
        if (pr) pr.deploy = { ...prRec.deploy };
        paintDeploy(prNumber);
        appendDeploy(prNumber, `\n[deploy #${prNumber}] finished: ${s}\n`, s === 'success' ? 'ok' : 'err');
        repoCtx.clearActive(issue.number);
        if (s === 'success' && pipelineDepth() === 'merge') onMerge(prNumber);
        return;
      }
      if (rec.live && rec.live.deploy && rec.live.deploy[prNumber]) { repoCtx.setActive(issue.number); return streamDeploy(prNumber, true); }
      await sleep(3000);
    }
    appendDeploy(prNumber, `\n[deploy #${prNumber}] status check timed out — tap Deploy again.\n`, 'stderr');
  }

  async function refreshDeployTiming(prNumber) {
    try {
      const rec = await fetchRecord();
      const prRec = (rec.prs || {})[prNumber];
      const pr = findPr(prNumber);
      if (prRec && pr) { pr.deploy = { ...prRec.deploy }; paintDeploy(prNumber); }
    } catch { /* ignore */ }
  }

  // --- Merge flow (per PR) ---------------------------------------------------
  async function onMerge(prNumber) {
    const pr = findPr(prNumber);
    if (!pr) return;
    const ms = (pr.merge && pr.merge.status) || 'idle';
    if (ms === 'merging') { const p = mergePanel(prNumber); if (p) p.classList.toggle('show'); return; }
    const deployOk = pr.deploy && pr.deploy.status === 'success';
    let force = false;
    if (!deployOk) {
      const dstatus = (pr.deploy && pr.deploy.status) || 'idle';
      if (!window.confirm(`Deploy for PR #${prNumber} hasn't succeeded (status: ${dstatus}). Merge anyway?`)) return;
      force = true;
    } else if (ms === 'success' || ms === 'failed' || ms === 'aborted') {
      if (!window.confirm(`Merge PR #${prNumber} again?`)) return;
    }
    pr.merge.status = 'merging';
    paintMerge(prNumber);
    await streamMerge(prNumber, false, force);
  }

  async function onMergeAbort(prNumber) {
    const pr = findPr(prNumber);
    if (!pr || !pr.merge || pr.merge.status !== 'merging') return;
    if (!window.confirm(`Abort the current merge for PR #${prNumber}?`)) return;
    appendMerge(prNumber, `\n[abort requested…]\n`, 'stderr');
    try {
      await fetch(`/api/repos/${enc(repo.name)}/issues/${issue.number}/merge/${prNumber}/cancel`, { method: 'POST' });
    } catch (e) {
      appendMerge(prNumber, `\n[abort failed: ${e.message}]\n`, 'err');
    }
  }

  async function streamMerge(prNumber, reconnect, force = false) {
    const pr = findPr(prNumber);
    if (!pr) return;
    if (reconnect) { pr.merge.status = 'merging'; paintMerge(prNumber); appendMerge(prNumber, `\n[reconnecting merge PR #${prNumber}…]\n`, 'stderr'); }
    const url = `/api/repos/${enc(repo.name)}/issues/${issue.number}/merge/${prNumber}`;
    let finalStatus = null, resultData = null;
    try {
      const resp = await fetch(url, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ force }),
      });
      if (!resp.ok || !resp.body) { appendMerge(prNumber, `\n[error] HTTP ${resp.status}\n`, 'err'); return reconcileMerge(prNumber); }
      await pumpSSE(resp, {
        onChunk: (t, s) => appendMerge(prNumber, t, s === 'stderr' ? 'stderr' : null),
        onError: (m) => appendMerge(prNumber, `\n[error] ${m}\n`, 'err'),
        onResult: (d) => { finalStatus = d.status; resultData = d; },
      });
    } catch (e) {
      appendMerge(prNumber, `\n[connection dropped: ${e.message}] — merge still running, checking status…\n`, 'stderr');
      return reconcileMerge(prNumber);
    }
    if (finalStatus === 'blocked') {
      pr.merge.status = 'idle';
      paintMerge(prNumber);
      const p = mergePanel(prNumber); if (p) p.classList.add('show');
      appendMerge(prNumber, `\n${(resultData && resultData.message) || 'blocked'}\n`, 'err');
      return;
    }
    if (finalStatus) {
      pr.merge.status = finalStatus;
      pr.merge.hasConversation = true;
      paintMerge(prNumber);
      appendMerge(prNumber, `\n[merge #${prNumber}] finished: ${finalStatus}\n`, finalStatus === 'success' ? 'ok' : 'err');
      refreshMergeTiming(prNumber);
    } else {
      return reconcileMerge(prNumber);
    }
  }

  async function reconcileMerge(prNumber) {
    for (let i = 0; i < 200; i++) {
      let rec;
      try { rec = await fetchRecord(); } catch { await sleep(3000); continue; }
      const prRec = (rec.prs || {})[prNumber];
      const s = prRec && prRec.merge && prRec.merge.status;
      if (s === 'success' || s === 'failed' || s === 'aborted') {
        const pr = findPr(prNumber);
        if (pr) pr.merge = { ...prRec.merge };
        paintMerge(prNumber);
        appendMerge(prNumber, `\n[merge #${prNumber}] finished: ${s}\n`, s === 'success' ? 'ok' : 'err');
        return;
      }
      if (rec.live && rec.live.merge && rec.live.merge[prNumber]) return streamMerge(prNumber, true);
      await sleep(3000);
    }
    appendMerge(prNumber, `\n[merge #${prNumber}] status check timed out — tap Merge again.\n`, 'stderr');
  }

  async function refreshMergeTiming(prNumber) {
    try {
      const rec = await fetchRecord();
      const prRec = (rec.prs || {})[prNumber];
      const pr = findPr(prNumber);
      if (prRec && pr) { pr.merge = { ...prRec.merge }; paintMerge(prNumber); }
    } catch { /* ignore */ }
  }

  // --- shared helpers -------------------------------------------------------
  function fetchRecord() {
    return fetch(`/api/repos/${enc(repo.name)}/issues/${issue.number}/record`).then((x) => x.json());
  }

  function syncPrsFromRecord(rec) {
    const arr = Object.values(rec.prs || {})
      .sort((a, b) => b.prNumber - a.prNumber)
      .map((p) => ({
        prNumber: p.prNumber, prUrl: p.prUrl, title: p.title, createdAt: p.createdAt,
        deploy: { ...p.deploy }, merge: { ...p.merge },
      }));
    st.prs = arr;
    renderPrs();
  }

  async function loadWorkTranscript() {
    worklog.classList.add('show');
    worklog.innerHTML = '<span class="stderr">loading transcript…</span>';
    const rec = await fetchRecord();
    worklog.innerHTML = '';
    appendWork(rec.work.conversation || '(no transcript stored yet)', rec.work.conversation ? null : 'stderr');
  }

  async function loadDeployTranscript(prNumber) {
    const panelEl = deployPanel(prNumber);
    if (!panelEl) return;
    panelEl.classList.add('show');
    panelEl.innerHTML = '<span class="stderr">loading transcript…</span>';
    const rec = await fetchRecord();
    panelEl.innerHTML = '';
    const prRec = (rec.prs || {})[prNumber];
    const conv = prRec && prRec.deploy && prRec.deploy.conversation;
    appendTo(panelEl, conv || '(no transcript stored yet)', conv ? null : 'stderr');
  }

  async function loadMergeTranscript(prNumber) {
    const panelEl = mergePanel(prNumber);
    if (!panelEl) return;
    panelEl.classList.add('show');
    panelEl.innerHTML = '<span class="stderr">loading transcript…</span>';
    const rec = await fetchRecord();
    panelEl.innerHTML = '';
    const prRec = (rec.prs || {})[prNumber];
    const conv = prRec && prRec.merge && prRec.merge.conversation;
    appendTo(panelEl, conv || '(no transcript stored yet)', conv ? null : 'stderr');
  }

  function appendTo(panelEl, text, cls) {
    const span = document.createElement('span');
    if (cls) span.className = cls;
    span.textContent = text;
    panelEl.appendChild(span);
    panelEl.scrollTop = panelEl.scrollHeight;
  }
  function appendWork(text, cls) { appendTo(worklog, text, cls); }
  function appendDeploy(prNumber, text, cls) { const p = deployPanel(prNumber); if (p) appendTo(p, text, cls); }
  function appendMerge(prNumber, text, cls) { const p = mergePanel(prNumber); if (p) appendTo(p, text, cls); }

  function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }

  return el;
}

// Read an SSE response body, dispatching parsed events to handlers.
async function pumpSSE(resp, { onChunk, onError, onResult, onMeta }) {
  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buf = '';
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    let sep;
    while ((sep = buf.indexOf('\n\n')) !== -1) {
      const raw = buf.slice(0, sep);
      buf = buf.slice(sep + 2);
      const evt = parseEvent(raw);
      if (!evt) continue;
      if (evt.event === 'chunk') onChunk && onChunk(evt.data.text, evt.data.stream);
      else if (evt.event === 'meta') onMeta && onMeta(evt.data);
      else if (evt.event === 'error') onError && onError(evt.data.message);
      else if (evt.event === 'result') onResult && onResult(evt.data);
    }
  }
}

function parseEvent(raw) {
  let event = 'message';
  let dataLine = '';
  for (const line of raw.split('\n')) {
    if (line.startsWith('event:')) event = line.slice(6).trim();
    else if (line.startsWith('data:')) dataLine += line.slice(5).trim();
  }
  if (!dataLine) return null;
  try { return { event, data: JSON.parse(dataLine) }; } catch { return null; }
}

function escape(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ---- PR detail page: hash route #/pr/<repo>/<issue>/<pr> -------------------
const mainView = document.getElementById('mainView');
const prDetailView = document.getElementById('prDetailView');

function parseHash() {
  const m = decodeURIComponent(location.hash).match(/^#\/pr\/([^/]+)\/(\d+)\/(\d+)$/);
  if (!m) return null;
  return { repo: m[1], issueNumber: Number(m[2]), prNumber: Number(m[3]) };
}

function route() {
  const parsed = parseHash();
  if (parsed) {
    mainView.style.display = 'none';
    prDetailView.style.display = '';
    renderPrDetail(parsed.repo, parsed.issueNumber, parsed.prNumber);
  } else {
    mainView.style.display = '';
    prDetailView.style.display = 'none';
  }
}
window.addEventListener('hashchange', route);

async function renderPrDetail(repoName, issueNumber, prNumber) {
  prDetailView.innerHTML = '<p class="muted" style="padding:16px">Loading…</p>';

  let repos = window.__repos;
  if (!repos) {
    const r = await fetch('/api/repos').then((x) => x.json());
    window.__repos = repos = r.repos;
  }
  const repoObj = repos.find((r) => r.name === repoName);
  if (!repoObj) { prDetailView.innerHTML = '<a class="backlink" href="#">← Back</a><p class="err-inline">Repo not found.</p>'; return; }

  let issuesData;
  try {
    issuesData = await fetch(`/api/repos/${enc(repoName)}/issues`).then((x) => x.json());
  } catch (e) {
    prDetailView.innerHTML = `<a class="backlink" href="#">← Back</a><p class="err-inline">Failed to load: ${escape(e.message)}</p>`;
    return;
  }
  const issue = (issuesData.issues || []).find((i) => i.number === issueNumber);
  if (!issue) { prDetailView.innerHTML = '<a class="backlink" href="#">← Back</a><p class="err-inline">Issue not found.</p>'; return; }

  prDetailView.innerHTML = '';
  const back = document.createElement('a');
  back.href = '#';
  back.className = 'backlink';
  back.textContent = '← Back to all repos';
  prDetailView.appendChild(back);

  const repoCtx = createRepoCtx((issuesData.activeWorkIssues && issuesData.activeWorkIssues[0]) ?? null);
  prDetailView.appendChild(renderIssue(repoObj, issue, repoCtx, { pinned: true }));

  const extra = document.createElement('div');
  extra.className = 'pr-detail-extra';
  extra.innerHTML = '<p class="muted" style="padding:8px 4px">Loading history & chat…</p>';
  prDetailView.appendChild(extra);

  const rec = await fetch(`/api/repos/${enc(repoName)}/issues/${issueNumber}/record`).then((x) => x.json());
  const prRec = (rec.prs || {})[prNumber];
  extra.innerHTML = '';
  extra.appendChild(renderDeployHistory(prRec));
  extra.appendChild(renderChatPanel(repoName, issueNumber, prNumber, prRec));
}

function renderDeployHistory(prRec) {
  const wrap = document.createElement('div');
  wrap.className = 'history-panel';
  const history = (prRec && prRec.deployHistory) || [];
  const heading = document.createElement('h3');
  heading.textContent = `Deploy history (${history.length})`;
  wrap.appendChild(heading);
  if (!history.length) {
    const p = document.createElement('div');
    p.className = 'muted';
    p.textContent = 'No past deploy attempts yet — only the current one (if any) shown on the pipeline above.';
    wrap.appendChild(p);
    return wrap;
  }
  const list = document.createElement('div');
  list.className = 'history-list';
  [...history].reverse().forEach((d) => {
    const row = document.createElement('div');
    row.className = `history-row ${STATE_CLASS[d.status] || 'st-idle'}`;
    const bits = [d.buildNumber ? `build ${d.buildNumber}` : null, d.version ? `v${d.version}` : null]
      .filter(Boolean).join(' · ');
    const when = d.finishedAt ? new Date(d.finishedAt).toLocaleString() : '';
    const ran = d.durationMs != null ? `ran ${fmtDur(d.durationMs)}` : '';
    row.innerHTML =
      `<span class="dot"></span><span class="history-status">${escape(STATE_LABEL.deploy[d.status] || d.status)}</span>` +
      `<span class="muted">${escape(bits)}</span><span class="muted">${escape(when)}</span><span class="muted">${escape(ran)}</span>`;
    list.appendChild(row);
  });
  wrap.appendChild(list);
  return wrap;
}

function renderChatPanel(repoName, issueNumber, prNumber, prRec) {
  const wrap = document.createElement('div');
  wrap.className = 'chat-panel';
  wrap.innerHTML = `
    <h3>Chat with this PR</h3>
    <div class="chat-messages"></div>
    <div class="chat-inputrow">
      <textarea class="chat-input" rows="3" placeholder="Describe a change… e.g. &quot;add a dark mode toggle&quot;"></textarea>
      <div class="chat-actions">
        <button class="chat-send">Send (plan)</button>
        <button class="iconbtn abortbtn chat-abort" hidden>⨯ Abort</button>
      </div>
    </div>`;

  const messagesEl = wrap.querySelector('.chat-messages');
  const inputEl = wrap.querySelector('.chat-input');
  const sendBtn = wrap.querySelector('.chat-send');
  const abortBtn = wrap.querySelector('.chat-abort');

  const messages = ((prRec && prRec.chat && prRec.chat.messages) || []).slice();
  let awaitingApply = false;

  function renderMessages() {
    if (!messages.length) {
      messagesEl.innerHTML = '<div class="chat-empty">No messages yet — describe a change below to get a plan.</div>';
      return;
    }
    messagesEl.innerHTML = '';
    for (const m of messages) {
      const bubble = document.createElement('div');
      bubble.className = `chat-bubble chat-${m.role === 'user' ? 'user' : 'assistant'}`;
      const roleLabel = m.role === 'user' ? 'You' : 'Copilot';
      const metaEl = document.createElement('div');
      metaEl.className = 'chat-meta';
      metaEl.textContent = `${roleLabel} · ${m.mode || ''}`;
      const textEl = document.createElement('div');
      textEl.className = 'chat-text';
      textEl.textContent = m.text;
      bubble.append(metaEl, textEl);
      messagesEl.appendChild(bubble);
    }
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
  renderMessages();

  function setSending(sending) {
    sendBtn.disabled = sending;
    inputEl.disabled = sending;
    abortBtn.hidden = !sending;
  }

  async function sendTurn(mode, text) {
    setSending(true);
    const userMsg = { role: 'user', text: mode === 'apply' ? `[execute plan] ${text}` : text, mode, at: new Date().toISOString() };
    messages.push(userMsg);
    renderMessages();
    const assistantMsg = { role: 'assistant', text: '', mode, at: new Date().toISOString() };
    let finalStatus = null;
    try {
      const resp = await fetch(`/api/repos/${enc(repoName)}/issues/${issueNumber}/prs/${prNumber}/chat`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, mode }),
      });
      if (!resp.ok || !resp.body) {
        assistantMsg.text = `[error] HTTP ${resp.status}`;
        messages.push(assistantMsg); renderMessages(); setSending(false); return;
      }
      await pumpSSE(resp, {
        onChunk: (t) => { assistantMsg.text += t; renderMessages(); },
        onError: (m) => { assistantMsg.text += `\n[error] ${m}`; },
        onResult: (d) => { finalStatus = d.status; },
      });
    } catch (e) {
      assistantMsg.text += `\n[connection dropped: ${e.message}]`;
    }
    messages.push(assistantMsg);
    renderMessages();
    setSending(false);

    if (mode === 'plan' && finalStatus === 'success') {
      awaitingApply = true;
      sendBtn.textContent = 'Execute this plan';
    } else if (mode === 'apply' && finalStatus === 'success') {
      // New commits landed — Deploy/Merge reset; reload the whole detail page
      // so the pipeline above reflects that instead of showing stale state.
      renderPrDetail(repoName, issueNumber, prNumber);
      return;
    } else {
      awaitingApply = false;
      sendBtn.textContent = 'Send (plan)';
    }
  }

  sendBtn.addEventListener('click', () => {
    if (awaitingApply) {
      const lastUser = [...messages].reverse().find((m) => m.role === 'user' && m.mode === 'plan');
      sendTurn('apply', (lastUser && lastUser.text) || 'the plan above');
      return;
    }
    const text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = '';
    sendTurn('plan', text);
  });

  abortBtn.addEventListener('click', async () => {
    try {
      await fetch(`/api/repos/${enc(repoName)}/issues/${issueNumber}/prs/${prNumber}/chat/cancel`, { method: 'POST' });
    } catch { /* ignore */ }
  });

  return wrap;
}

loadRepos().then(route);
</script>
